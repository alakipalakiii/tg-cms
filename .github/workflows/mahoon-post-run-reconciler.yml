# MAHOON post-run reconciler: closes orphan durable mutation intents.
#
# Triggered after every completed publisher run via workflow_run. It processes
# only the "MAHOON static publisher" workflow, never itself, so it cannot
# recurse.
#
#   Class A (mutation job SKIPPED): the approved unexecuted-intent abandonment path.
#   Class B (mutation job FAILED):  the existing recovery/readback mechanism.
#
# The journal on main is the single source of truth for which operation is
# orphaned. The reconciler fails closed if the journal cannot be classified.

name: MAHOON post-run reconciler

on:
  workflow_run:
    workflows: ["MAHOON static publisher"]
    types: [completed]
  # Manual entry point: the journal may hold an orphan whose recording run
  # completed as "success" (a success run whose mutation job was skipped and
  # whose journal write is still open cannot be reached by the conclusion gate
  # below). Bind such a reconciliation to that exact recording run id.
  workflow_dispatch:
    inputs:
      run_id:
        description: "Exact publisher workflow run id that recorded the orphan intent"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: mahoon-post-run-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    # A success run is normally already closed by the in-run flow; only
    # failed/cancelled completed publisher runs leave a durable mutation
    # intent unresolved. The manual dispatch bypasses that conclusion gate
    # and binds to the exact recording run supplied in inputs.run_id.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the reconciler tooling
        # The reconciler runs the CURRENT toolchain; the original run's sealed
        # artifacts carry their own producer provenance and are verified
        # against it. Checking out the source head would predate
        # reconciliation-decision entirely.
        uses: actions/checkout@v4
        with:
          ref: main
          path: code

      - name: Check out production journal
        uses: actions/checkout@v4
        with:
          ref: main
          path: state

      - name: Download required artifacts from original run
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: handoff

      - name: Download required artifacts from the bound recording run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: handoff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Identify and classify orphaned intent
        id: classify
        env:
          PYTHONPATH: code/tools/publisher:code/tools:code
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PAYLOAD: ${{ toJson(github.event) }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          def gh(repo, path):
              result = subprocess.run(["gh", "api", f"repos/{repo}/{path}"],
                                      capture_output=True, text=True, check=True)
              return json.loads(result.stdout)

          def github_repo():
              return os.environ.get("GITHUB_REPOSITORY", "alakipalakiii/tg-cms")

          # The source recording run is bound explicitly: workflow_run events
          # carry it in the trigger payload; manual dispatch pins it via
          # inputs.run_id so a success-run orphan (skipped mutation job with
          # journal still open) can still be reconciled without touching the
          # conclusion gate.
          event = json.loads(os.environ["EVENT_PAYLOAD"])
          source_repo = event.get("repository", {}).get("full_name") or github_repo()
          if event.get("name") == "workflow_dispatch":
              run_id = str(event.get("inputs", {}).get("run_id", "")).strip()
              if not run_id.isdigit():
                  print("RECONCILE=blocked; workflow_dispatch requires a numeric inputs.run_id")
                  sys.exit(1)
          else:
              run = event["workflow_run"]
              run_id = str(run["id"])
          run_data = gh(source_repo, f"actions/runs/{run_id}")
          source_sha = run_data["head_sha"]
          source_attempt = int(run_data["run_attempt"])
          jobs = gh(source_repo, f"actions/runs/{run_id}/jobs").get("jobs", [])
          job_by_name = {j.get("name"): j for j in jobs}

          journal = json.loads(
              Path("state/publisher-state/production-transaction-journal.json").read_text(encoding="utf-8"))
          active = journal.get("active")
          if not active:
              print("RECONCILE=none; journal has no active transaction")
              sys.exit(0)

          if active.get("state") != "intent_recorded":
              print(f"RECONCILE=none; journal active state is {active.get('state')!r}")
              sys.exit(0)

          target = None
          for name, op in active.get("operations", {}).items():
              if (op.get("attempts") and op.get("result_state") == "NOT_REPORTED"):
                  target = name
                  break
          if target is None:
              print("RECONCILE=none; no operation has a recorded unreported attempt")
              sys.exit(0)

          # Artifact names and sealed file names are operation-specific; map
          # them so the reconciler can open exactly the right handoff files.
          intent_artifact_map = {
              "upload_version": ("a6-upload-intent", "upload-intent.json"),
              "deploy_zero_percent": ("a6-zero-intent", "zero-percent-intent.json"),
              "promote": ("a6-promote-intent", "promote-intent.json"),
              "rollback": ("a6-rollback-intent", "rollback-intent.json"),
          }
          if target not in intent_artifact_map:
              print(f"RECONCILE=blocked; operation {target!r} has no known intent artifact mapping")
              sys.exit(1)

          # An orphan intent belongs to the run that recorded it. The journal
          # binds the active transaction to recording runs via
          # execution_attempts[].run_id; the sealed intent artifact is named
          # after its recording run. CHECK_ONLY and early-failing runs record
          # no durable intent, so when this source run is not the recorder it
          # left nothing behind: say "none" instead of failing the pipeline
          # on someone else's orphan.
          art = gh(source_repo, f"actions/runs/{run_id}/artifacts")
          artifact_names = {a.get("name") for a in art.get("artifacts", [])}
          attempts = [str(e.get("run_id")) for e in active.get("execution_attempts", []) if e.get("run_id")]
          recorded_by_this_run = run_id in attempts
          intent_artifact, intent_file = intent_artifact_map[target]
          intent_artifact_full = f"{intent_artifact}-{run_id}"
          if not (recorded_by_this_run and intent_artifact_full in artifact_names):
              print(f"RECONCILE=none; run {run_id} did not record the active orphan intent (recording runs={attempts}, intent artifact {intent_artifact_full!r} present={intent_artifact_full in artifact_names})")
              sys.exit(0)

          job_map = {
              "upload_version": "cloudflare-upload-operation",
              "deploy_zero_percent": "cloudflare-zero-percent-operation",
              "promote": "cloudflare-promote-operation",
              "rollback": "cloudflare-rollback-operation",
          }
          cf_job_name = job_map.get(target, f"cloudflare-{target}-operation")
          cf_job = job_by_name.get(cf_job_name)
          if cf_job is None:
              print(f"RECONCILE=blocked; CF job {cf_job_name!r} is missing from the source run")
              sys.exit(1)
          conclusion = cf_job.get("conclusion")
          if conclusion == "skipped":
              cls = "skipped"
          elif conclusion in ("failure", "cancelled"):
              cls = "failed"
          else:
              print(f"RECONCILE=none; CF job {cf_job_name!r} conclusion is {conclusion!r}; no orphan intent pending")
              sys.exit(0)

          # Artifact names and sealed file names are operation-specific; map
          # them so the reconciler can open exactly the right handoff files.

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"operation={target}\n")
              f.write(f"cls={cls}\n")
              f.write(f"run_id={run_id}\n")
              f.write(f"source_sha={source_sha}\n")
              f.write(f"source_attempt={source_attempt}\n")
              f.write(f"reconcile=needed\n")
              f.write(f"source_repo={source_repo}\n")
              f.write(f"intent_artifact={intent_artifact}\n")
              f.write(f"intent_file={intent_file}\n")
          print(f"RECONCILE=needed CLASS={cls} OP={target} JOB={cf_job_name} CONCL={conclusion} ART={intent_artifact}-{run_id}")
          PY

      - name: Load production baseline and journal CAS guard
        id: baseline
        if: ${{ steps.classify.outputs.reconcile == 'needed' }}
        env:
          PYTHONPATH: code/tools/publisher:code/tools:code
          EVENT_PAYLOAD: ${{ toJson(github.event) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          out = Path(os.environ["GITHUB_OUTPUT"])

          # Journal CAS guard: the state checkout is on main; compute the exact
          # digest and generation the writer will check against.
          journal_path = Path("state/publisher-state/production-transaction-journal.json")
          journal = json.loads(journal_path.read_text(encoding="utf-8"))
          try:
              from publisher.transaction_journal import journal_digest
              digest = journal_digest(journal)
          except ImportError:
              import hashlib
              digest = hashlib.sha256(
                  json.dumps(journal, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
              ).hexdigest()
          expected_generation = journal.get("generation", 0)
          expected_revision = journal.get("active", {}).get("content_revision", 0)
          with open(out, "a") as f:
              f.write(f"expected_generation={expected_generation}\n")
              f.write(f"journal_sha256={digest}\n")
              f.write(f"expected_revision={expected_revision}\n")

          # Production baseline for abandonment evidence (Class A only).
          # The original publisher run uploads it as a6-production-baseline-<run_id>.
          event = json.loads(os.environ["EVENT_PAYLOAD"])
          original_run_id = str(event.get("inputs", {}).get("run_id")) if event.get("name") == "workflow_dispatch" else str(event["workflow_run"]["id"])
          baseline = None
          candidate = Path("handoff") / f"a6-production-baseline-{original_run_id}"
          if candidate.is_dir():
              for p in sorted(candidate.iterdir()):
                  if p.is_file() and p.name.endswith(".json"):
                      baseline = json.loads(p.read_text(encoding="utf-8"))
                      break
          if baseline is not None:
              normalized = {
                  "current_version": baseline.get("current_version"),
                  "deployment_id": baseline.get("deployment_id"),
                  "current_version_type": baseline.get("current_version_type"),
              }
              baseline_path = Path("production-baseline.json")
              baseline_path.write_text(json.dumps(normalized), encoding="utf-8")
              with open(out, "a") as f:
                  f.write("production_baseline=production-baseline.json\n")
          else:
              with open(out, "a") as f:
                  f.write("production_baseline=\n")
          PY

      - name: Reconcile orphaned Class A intent (skipped mutation)
        if: ${{ steps.classify.outputs.reconcile == 'needed' && steps.classify.outputs.cls == 'skipped' }}
        env:
          PYTHONPATH: code/tools/publisher:code/tools:code
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_NAME=$(echo "${{ steps.classify.outputs.source_repo }}" | awk -F/ '{print $NF}')
          OWNER_NAME=$(echo "${{ steps.classify.outputs.source_repo }}" | awk -F/ '{print $1}')
          python code/tools/publisher/workflow_stage_cli.py reconciliation-decision \
            --operation "${{ steps.classify.outputs.operation }}" \
            --intent "handoff/${{ steps.classify.outputs.intent_artifact }}-${{ steps.classify.outputs.run_id }}/${{ steps.classify.outputs.intent_file }}" \
            --journal state/publisher-state/production-transaction-journal.json \
            --repository state \
            --remote origin \
            --branch main \
            --source-run-id "${{ steps.classify.outputs.run_id }}" \
            --source-run-attempt "${{ steps.classify.outputs.source_attempt }}" \
            --source-sha "${{ steps.classify.outputs.source_sha }}" \
            --github-owner "${OWNER_NAME}" \
            --github-repo "${BASE_NAME}" \
            --build-bundle "handoff/a6-build-${{ steps.classify.outputs.run_id }}/runner-evidence/v1-build-bundle.json" \
            --admission "handoff/a6-admission-${{ steps.classify.outputs.run_id }}/admission.json" \
            --production-baseline "${{ steps.baseline.outputs.production_baseline }}" \
            --expected-generation "${{ steps.baseline.outputs.expected_generation }}" \
            --journal-sha256 "${{ steps.baseline.outputs.journal_sha256 }}" \
            --expected-revision "${{ steps.baseline.outputs.expected_revision }}"

      - name: Reconcile orphaned Class B intent (failed mutation)
        if: ${{ steps.classify.outputs.reconcile == 'needed' && steps.classify.outputs.cls == 'failed' }}
        env:
          PYTHONPATH: code/tools/publisher:code/tools:code
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKER: mahoon-art-magazine
          CF_HOSTNAME: ${{ vars.CLOUDFLARE_EXPECTED_HOSTNAME }}
        run: |
          BASE_NAME=$(echo "${{ steps.classify.outputs.source_repo }}" | awk -F/ '{print $NF}')
          OWNER_NAME=$(echo "${{ steps.classify.outputs.source_repo }}" | awk -F/ '{print $1}')
          python code/tools/publisher/workflow_stage_cli.py reconciliation-decision \
            --operation "${{ steps.classify.outputs.operation }}" \
            --intent "handoff/${{ steps.classify.outputs.intent_artifact }}-${{ steps.classify.outputs.run_id }}/${{ steps.classify.outputs.intent_file }}" \
            --journal state/publisher-state/production-transaction-journal.json \
            --repository state \
            --remote origin \
            --branch main \
            --source-run-id "${{ steps.classify.outputs.run_id }}" \
            --source-run-attempt "${{ steps.classify.outputs.source_attempt }}" \
            --source-sha "${{ steps.classify.outputs.source_sha }}" \
            --github-owner "${OWNER_NAME}" \
            --github-repo "${BASE_NAME}" \
            --build-bundle "handoff/a6-build-${{ steps.classify.outputs.run_id }}/runner-evidence/v1-build-bundle.json" \
            --admission "handoff/a6-admission-${{ steps.classify.outputs.run_id }}/admission.json" \
            --production-baseline "${{ steps.baseline.outputs.production_baseline }}" \
            --expected-generation "${{ steps.baseline.outputs.expected_generation }}" \
            --journal-sha256 "${{ steps.baseline.outputs.journal_sha256 }}" \
            --expected-revision "${{ steps.baseline.outputs.expected_revision }}"
