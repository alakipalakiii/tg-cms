name: MAHOON read-only live functionality

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Authoritatively verified version"
        type: string
        required: true
      baseline_run_id:
        description: "Optional prior read-only diagnostic for new-post comparison"
        type: string
        required: false
        default: ""
      pin_candidate:
        description: "Read a verified zero-percent candidate with browser context version override"
        type: choice
        required: false
        default: "NO"
        options: ["NO", "YES"]
      audio_matrix:
        description: "Isolate audio transport and browser interception with a small read-only matrix"
        type: choice
        required: false
        default: "NO"
        options: ["NO", "YES"]

permissions:
  contents: read
  actions: read

concurrency:
  group: mahoon-read-only-functionality
  cancel-in-progress: false

jobs:
  live-functionality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/dreary-disk/package-lock.json
      - run: npm ci --prefix website/dreary-disk
      - name: Install lockfile-pinned Chromium
        working-directory: website/dreary-disk
        run: npx playwright install --with-deps chromium
      - name: Run existing browser self-test
        run: node tools/publisher/prepromotion_browser_gate.mjs --self-test > browser-self-test.json
      - name: Run static archive regression fixtures
        run: node tools/publisher/test_static_archive.mjs
      - name: Read prior browser post identities
        if: ${{ inputs.baseline_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: mahoon-live-functionality-${{ inputs.baseline_run_id }}
          path: baseline
          run-id: ${{ inputs.baseline_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - name: Check browser interactions read-only
        env:
          MAHOON_EXPECTED_VERSION: ${{ inputs.expected_version }}
          MAHOON_BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          MAHOON_PIN_CANDIDATE: ${{ inputs.pin_candidate }}
        run: |
          if [ '${{ inputs.audio_matrix }}' = 'YES' ]; then
            node tools/publisher/audio_runtime_diagnostic.mjs
          else
            node tools/publisher/live_functionality_smoke.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mahoon-live-functionality-${{ github.run_id }}
          path: |
            browser-self-test.json
            runner-evidence/live-functionality/**
          if-no-files-found: warn
