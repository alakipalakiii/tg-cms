name: MAHOON static publisher

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run the shared publisher mode"
        required: true
        default: CHECK_ONLY
        type: choice
        options: [CHECK_ONLY, PROOF_ZERO_PERCENT, PUBLISH, FAILURE_INJECTION, CONTENT_DIAGNOSTIC, SAFETY_TESTS_ONLY]
      expected_fingerprint:
        description: "Optional reviewed pending-candidate fingerprint for a no-change proof"
        required: false
        default: ""
        type: string
      auth_only:
        description: "Run only the CI Wrangler authentication probe"
        required: false
        default: false
        type: boolean
      ready:
        description: "Explicitly authorize the already-reviewed production cutover"
        required: false
        default: "NO"
        type: choice
        options: ["NO", "YES"]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: mahoon-production-publisher
  cancel-in-progress: false

  
jobs:
  ci-auth-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'CHECK_ONLY' && inputs.auth_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "773d2dc31655b158d088296a14af5834"
    steps:
      - name: CI Wrangler authentication proof
        run: npx wrangler@4.83.0 whoami

  content-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'CONTENT_DIAGNOSTIC' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read-only content transport diagnostic
        run: python tools/publisher/github_content_diagnostic.py
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: mahoon-github-content-transport-diagnostic
          path: runner-evidence/github-content-api-transport-matrix.json

  safety-tests-only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'SAFETY_TESTS_ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/dreary-disk/package-lock.json
      - name: Install project and Playwright dependencies
        run: npm ci --prefix website/dreary-disk
      - name: Install Chromium for browser-gate fixtures
        working-directory: website/dreary-disk
        run: npx playwright install --with-deps chromium
      - name: Run promotion-safety regression suite
        env:
          PYTHONPATH: tools/publisher:tools:.
        run: python -m unittest discover -s tools/publisher -p 'test_*.py'
      - name: Build website from checked-in locked content
        env:
          PUBLIC_MAHOON_SNAPSHOT_BINDING: "1"
        run: npm run build --prefix website/dreary-disk
      - name: Record read-only proof boundary
        run: |
          echo "LIVE_REVISION_LOOKUPS=0"
          echo "V2_EXPORTS=0"
          echo "CI_UPLOAD=NO"
          echo "CI_DEPLOYMENT=NO"
          echo "CI_TRAFFIC_MUTATION=NO"

  publisher:
    if: ${{ (github.event_name == 'schedule' || (inputs.mode != 'CONTENT_DIAGNOSTIC' && inputs.mode != 'SAFETY_TESTS_ONLY')) && !(github.event_name == 'workflow_dispatch' && inputs.auth_only == true) }}
    outputs:
      production_pass: ${{ steps.result.outputs.production_pass }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLISHER_MODE: ${{ github.event_name == 'schedule' && 'CHECK_ONLY' || inputs.mode }}
      CLOUDFLARE_ACCOUNT_ID: "773d2dc31655b158d088296a14af5834"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAHOON_WRANGLER: npx wrangler@4.83.0
      PUBLISHER_EXPECTED_FINGERPRINT: ${{ inputs.expected_fingerprint }}
      MAHOON_PUBLISH_READY: ${{ inputs.ready }}
      MAHOON_PUBLIC_CONTENT_REVISION_API: https://mahoon-content-revision.morentoofficial.workers.dev/public/content-revision-v1
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node for changed-revision builds
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/dreary-disk/package-lock.json
      - name: Install static site dependencies
        run: npm ci --prefix website/dreary-disk
      - name: Install Chromium for publisher browser gates
        working-directory: website/dreary-disk
        run: npx playwright install --with-deps chromium
      - name: Run publisher regression tests
        run: PYTHONPATH=tools/publisher:. python -m unittest discover -s tools/publisher -p 'test_*.py'
      - name: Run shared publisher
        id: execute
        run: python tools/m9/publisher_runner.py

      - name: Publish result marker
        id: result
        if: ${{ always() }}
        run: |
          if test -f runner-evidence/production-validation.json && python -c "import json; raise SystemExit(0 if json.load(open('runner-evidence/production-validation.json')).get('PASS') is True else 1)"; then
            echo "production_pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "production_pass=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload validated result
        if: ${{ steps.result.outputs.production_pass == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mahoon-publisher-production-result
          path: runner-evidence

  persist-state:
    needs: publisher
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'PUBLISH' && needs.publisher.result == 'success' && needs.publisher.outputs.production_pass == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mahoon-publisher-production-result
          path: runner-evidence
      - name: Refuse unproven state persistence
        run: |
          test -f runner-evidence/production-validation.json
          python - <<'PY'
          import json
          p=json.load(open('runner-evidence/production-validation.json', encoding='utf-8'))
          assert p.get('PASS') is True
          PY
      - name: Install only validated publisher state
        run: |
          test -f runner-evidence/published-state/production-content-fingerprint.json
          test -f runner-evidence/published-state/production-media-manifest.json
          test -f runner-evidence/published-state/immutable-media-index.json
          test -f runner-evidence/published-state/published-route-manifest.json
          test -f runner-evidence/published-state/published-static-state.json
          cp runner-evidence/published-state/production-content-fingerprint.json publisher-state/production-content-fingerprint.json
          cp runner-evidence/published-state/production-media-manifest.json publisher-state/production-media-manifest.json
          cp runner-evidence/published-state/immutable-media-index.json publisher-state/immutable-media-index.json
          cp runner-evidence/published-state/published-route-manifest.json publisher-state/published-route-manifest.json
          cp runner-evidence/published-state/published-route-manifest.json publisher-state/current-accepted-route-manifest.json
          cp runner-evidence/published-state/published-static-state.json publisher-state/published-static-state.json
          test -z "$(git diff --name-only -- publisher-state | grep -v -E '^publisher-state/(production-content-fingerprint|production-media-manifest|immutable-media-index|published-route-manifest|current-accepted-route-manifest|published-static-state)\.json$' || true)"
      - name: Persist only approved publisher state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publisher-state/production-content-fingerprint.json publisher-state/production-media-manifest.json publisher-state/published-route-manifest.json
          git add publisher-state/immutable-media-index.json
          git add publisher-state/current-accepted-route-manifest.json
          git add publisher-state/published-static-state.json
          git diff --cached --quiet || git commit -m "chore: persist published publisher state"
          git push
