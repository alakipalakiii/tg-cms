name: MAHOON static publisher

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run the authenticated no-change proof or the fail-closed publisher"
        required: true
        default: proof
        type: choice
        options: [proof, publish]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: mahoon-production-publisher
  cancel-in-progress: false

jobs:
  publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLISHER_MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Run publisher control-plane proof
        run: python tools/m9/publisher_runner.py
