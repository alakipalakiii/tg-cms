    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-build-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-production-proof-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-direct-result-${{ github.run_id }}', path: handoff }
        if: always()
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-recovered-result-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-readback-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-decision-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-rollback-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Execute separately authorized rollback
        env:
          PYTHONPATH: code/tools/publisher:code/tools:code
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          MAHOON_WRANGLER: npx wrangler@4.83.0
          CLOUDFLARE_ACCOUNT_ID: "773d2dc31655b158d088296a14af5834"
        run: |
          promote_result=handoff/promote-result.json
          refs=(--reference handoff/promote-intent.json --reference handoff/production-proof.json)
          if [ '${{ needs.rollback-intent-write.result }}' = 'success' ] && [ -f handoff/recovered-promote-result.json ]; then
            promote_result=handoff/recovered-promote-result.json
            refs+=(--reference handoff/promote-result.json --reference handoff/promote-recovery-readback.json --reference handoff/promote-recovery-decision.json)
          fi
          python code/tools/publisher/workflow_stage_cli.py execute-operation \
            --intent handoff/rollback-intent.json --build-bundle handoff/runner-evidence/v1-build-bundle.json \
            --prerequisite handoff/production-proof.json --journal state/publisher-state/production-transaction-journal.json \
            --sealed-root "handoff/runner-evidence/publisher-sealed/$(python -c 'import json; print(json.load(open("handoff/runner-evidence/v1-build-bundle.json"))["payload"]["content_fingerprint"])')/site" \
            --config code/website/dreary-disk/wrangler.jsonc --backend wrangler --output rollback-result.json \
            "${refs[@]}" --reference "$promote_result"
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-rollback-result-${{ github.run_id }}', path: rollback-result.json, if-no-files-found: error }

  rollback-result-write:
    needs: cloudflare-rollback-operation
    if: ${{ !cancelled() && needs.cloudflare-rollback-operation.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs:
      result_state: ${{ steps.record.outputs.result_state }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-rollback-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-rollback-result-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-production-proof-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: record
        run: |
          python code/tools/publisher/workflow_stage_cli.py record-result --intent handoff/rollback-intent.json --result handoff/rollback-result.json --journal state/publisher-state/production-transaction-journal.json --repository state --branch main --reference handoff/production-proof.json | tee record.json
          python -c "import json,os; open(os.environ['GITHUB_OUTPUT'],'a').write('result_state='+json.load(open('record.json'))['status']+'\n')"

  rollback-recovery-readback-observe:
    needs: rollback-result-write
    if: ${{ always() && needs.rollback-result-write.outputs.result_state == 'UNKNOWN' }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-rollback-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-rollback-result-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-production-proof-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python code/tools/publisher/workflow_stage_cli.py proof-recovery recovery-readback-observe --intent handoff/rollback-intent.json --result handoff/rollback-result.json --reference handoff/production-proof.json --output rollback-recovery-readback.json
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-rollback-readback-${{ github.run_id }}', path: rollback-recovery-readback.json, if-no-files-found: error }

  rollback-recovery-decision:
    if: ${{ always() && needs.rollback-recovery-readback-observe.result == 'success' }}
    needs: rollback-recovery-readback-observe
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      decision: ${{ steps.decision.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-rollback-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-rollback-result-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-rollback-readback-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-production-proof-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: decision
        run: |
          python code/tools/publisher/workflow_stage_cli.py proof-recovery recovery-decision --intent handoff/rollback-intent.json --result handoff/rollback-result.json --readback handoff/rollback-recovery-readback.json --journal state/publisher-state/production-transaction-journal.json --reference handoff/production-proof.json --output rollback-recovery-decision.json | tee decision-status.json
          python -c "import json,os; open(os.environ['GITHUB_OUTPUT'],'a').write('decision='+json.load(open('decision-status.json'))['status']+'\n')"
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-rollback-decision-${{ github.run_id }}', path: rollback-recovery-decision.json, if-no-files-found: error }

  rollback-reconcile-recovery-decision:
    if: ${{ always() && needs.rollback-recovery-decision.result == 'success' }}
    needs: rollback-recovery-decision
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-rollback-decision-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python code/tools/publisher/workflow_stage_cli.py reconcile-recovery-decision --decision handoff/rollback-recovery-decision.json --repository state --branch main

  rollback-create-recovered-result:
    needs: [rollback-recovery-decision, rollback-reconcile-recovery-decision]
    if: ${{ always() && needs.rollback-recovery-decision.outputs.decision == 'RECONCILED_APPLIED' && needs.rollback-reconcile-recovery-decision.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      recovered: ${{ steps.bridge.outputs.recovered }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-rollback-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-rollback-result-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-rollback-readback-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-rollback-decision-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-production-proof-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: bridge
        run: |
          python code/tools/publisher/workflow_stage_cli.py create-recovered-result --intent handoff/rollback-intent.json --result handoff/rollback-result.json --readback handoff/rollback-recovery-readback.json --decision handoff/rollback-recovery-decision.json --repository state --branch main --reference handoff/production-proof.json --output recovered-rollback-result.json
          echo "recovered=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-rollback-recovered-result-${{ github.run_id }}', path: recovered-rollback-result.json, if-no-files-found: error }
