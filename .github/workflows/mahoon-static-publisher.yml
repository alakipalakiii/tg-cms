        with: { name: 'a6-upload-direct-result-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-recovered-result-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-readback-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-decision-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-direct-result-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-recovered-result-${{ github.run_id }}', path: handoff }
