name: MAHOON static publisher

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run one publisher stage or the complete resumable transaction"
        required: true
        default: CHECK_ONLY
        type: choice
        options: [CHECK_ONLY, AUTO_TICK, PUBLISH, BUILD_AND_ZERO_PERCENT, REMOTE_PROOF, PROMOTE_AND_VALIDATE, CONTENT_DIAGNOSTIC, SAFETY_TESTS_ONLY, BROWSER_DIAGNOSTIC, RESUME_ADMITTED, POST_PROMOTION_FINALIZE, RETIRE_STALE_ADMITTED]
      expected_fingerprint:
        description: "Optional reviewed pending-candidate fingerprint for a no-change proof"
        required: false
        default: ""
        type: string
      ready:
        description: "Explicitly authorize the controlled production promotion"
        required: false
        default: "NO"
        type: choice
        options: ["NO", "YES"]
      transaction_id:
        description: "Exact transaction ID when resuming an existing bundle"
        required: false
        default: ""
        type: string
      source_run_id:
        description: "Build workflow run ID containing the immutable proof bundle"
        required: false
        default: ""
        type: string
      source_proof_run_id:
        description: "Remote-proof workflow run ID containing a passing proof result"
        required: false
        default: ""
        type: string
      resume_source_sha:
        description: "Exact executable source SHA bound to an existing admitted transaction"
        required: false
        default: ""
        type: string
      resume_source_run_id:
        description: "Canonical run to resume an in-flight transaction from operation_reported (reuses its build+admission artifacts)"
        required: false
        default: ""
        type: string
      preproof_source_run_id:
        description: "Passing pre-promotion proof run to revalidate and carry forward after an intent-stage failure"
        required: false
        default: ""
        type: string
      resume_source_admission_sha:
        description: "Seal digest of the source run's admission receipt; empty to trust the active journal"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: mahoon-production-publisher
  cancel-in-progress: false

jobs:
  retire-stale-admitted:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'RETIRE_STALE_ADMITTED' && inputs.ready == 'YES' && inputs.transaction_id == '704bdb7d7161c7c5c89ef4865788e71a67df26fd2fe4cfb695d297c3900d18d2' }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.sha }}', path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Read live revision and retire only the exact pristine admitted transaction
        run: |
          python code/tools/publisher/workflow_stage_cli.py retire-stale-admitted \
            --repository state \
            --journal state/publisher-state/production-transaction-journal.json \
            --transaction-id '${{ inputs.transaction_id }}' \
            --expected-revision 109 --remote origin --branch main | tee retirement-evidence.json
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-retirement-${{ github.run_id }}', path: retirement-evidence.json, if-no-files-found: error }

  content-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'CONTENT_DIAGNOSTIC' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read-only content transport diagnostic
        run: python tools/publisher/github_content_diagnostic.py
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: mahoon-github-content-transport-diagnostic-${{ github.run_id }}
          path: runner-evidence/github-content-api-transport-matrix.json

  browser-runtime-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'BROWSER_DIAGNOSTIC' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.sha }}', path: diagnostics, persist-credentials: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: diagnostics/website/dreary-disk/package-lock.json
      - name: Install lockfile-pinned project dependencies
        run: npm ci --prefix diagnostics/website/dreary-disk
      - name: Probe Chromium before browser installation
        id: chromium-before
        continue-on-error: true
        run: node diagnostics/tools/publisher/prepromotion_browser_gate.mjs --runtime-probe --output runner-evidence/chromium-before-install.json
      - name: Install the lockfile-pinned Playwright Chromium when absent or unlaunchable
        if: ${{ steps.chromium-before.outcome != 'success' }}
        working-directory: diagnostics/website/dreary-disk
        run: npx playwright install --with-deps chromium
      - name: Verify Chromium executable and launch
        run: node diagnostics/tools/publisher/prepromotion_browser_gate.mjs --runtime-probe --output runner-evidence/chromium-runtime.json
      - name: Run the existing browser gate self-test
        run: node diagnostics/tools/publisher/prepromotion_browser_gate.mjs --self-test > runner-evidence/browser-self-test.json
      - name: Compare complete hosted /posts/ responses for the admitted baseline and candidate
        if: always()
        env:
          MAHOON_BASELINE_VERSION: cefbdeec-a3a7-4963-a4e9-19937f7829f9
          MAHOON_CANDIDATE_VERSION: b3aa78ef-7b15-4d36-a87e-90dec308eb00
        run: |
          mkdir -p runner-evidence/posts-transfer
          probe() {
            local label="$1" version="$2" rc=0
            if curl --silent --show-error --location --max-redirs 5 --max-time 60 \
              --header "cloudflare-workers-version-overrides: mahoon-art-magazine=\"$version\"" \
              --dump-header "runner-evidence/posts-transfer/$label.headers" \
              --output /dev/null \
              --write-out $'%{http_code}\t%{time_starttransfer}\t%{time_total}\t%{size_download}\t%{content_type}\t%{url_effective}\t%{remote_ip}\n' \
              https://mahoonartmagazine.ir/posts/ > "runner-evidence/posts-transfer/$label.metrics"; then
              rc=0
            else
              rc=$?
            fi
            printf '%s\n' "$rc" > "runner-evidence/posts-transfer/$label.exit"
          }
          probe baseline "$MAHOON_BASELINE_VERSION"
          probe candidate "$MAHOON_CANDIDATE_VERSION"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("runner-evidence/posts-transfer")
          safe_headers = {"content-type", "content-length", "transfer-encoding", "cache-control",
                          "cf-cache-status", "cf-ray", "server", "x-mahoon-worker-version"}
          output = {"url": "https://mahoonartmagazine.ir/posts/", "results": {}}
          for label, expected in (("baseline", "cefbdeec-a3a7-4963-a4e9-19937f7829f9"),
                                  ("candidate", "b3aa78ef-7b15-4d36-a87e-90dec308eb00")):
              fields = (root / f"{label}.metrics").read_text().rstrip("\n").split("\t")
              status, ttfb, elapsed, size, content_type, final_url, remote_ip = fields
              blocks, current = [], None
              for line in (root / f"{label}.headers").read_text(errors="replace").splitlines():
                  if line.startswith("HTTP/"):
                      current = {"status_line": line, "headers": {}}
                      blocks.append(current)
                  elif current and ":" in line:
                      name, value = line.split(":", 1)
                      if name.lower() in safe_headers:
                          current["headers"][name.lower()] = value.strip()[:300]
              headers = blocks[-1]["headers"] if blocks else {}
              byte_count = int(float(size))
              length = headers.get("content-length")
              complete = int((root / f"{label}.exit").read_text().strip()) == 0
              if length and length.isdigit():
                  complete = complete and byte_count == int(length)
              output["results"][label] = {
                  "requested_version": expected, "http_status": int(status),
                  "content_type": content_type, "headers": headers,
                  "body_bytes_received": byte_count, "content_length_matches": None if not length or not length.isdigit() else byte_count == int(length),
                  "transfer_complete": complete, "time_to_first_byte_seconds": float(ttfb),
                  "total_seconds": float(elapsed), "final_url": final_url.split("?", 1)[0].split("#", 1)[0],
                  "remote_ip": remote_ip, "version_attributed": headers.get("x-mahoon-worker-version") == expected,
                  "curl_exit_code": int((root / f"{label}.exit").read_text().strip()),
              }
          target = Path("runner-evidence/posts-transfer-comparison.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(output, indent=2) + "\n", encoding="utf-8")
          print(target.read_text(encoding="utf-8"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mahoon-browser-runtime-diagnostic-${{ github.run_id }}
          path: runner-evidence/
          if-no-files-found: warn

  safety-tests-only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'SAFETY_TESTS_ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/dreary-disk/package-lock.json
      - name: Install project dependencies
        run: npm ci --prefix website/dreary-disk
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('website/dreary-disk/package-lock.json') }}
      - name: Install Chromium for browser-gate regression fixture
        working-directory: website/dreary-disk
        run: npx playwright install --with-deps chromium
      - name: Run resumable-publisher regression suite
        env:
          MAHOON_RUN_BROWSER_TESTS: "1"
          PYTHONPATH: tools/publisher:tools:.
        run: python -m unittest discover -s tools/publisher -p 'test_*.py'
      - name: Build website from checked-in locked content
        env:
          PUBLIC_MAHOON_SNAPSHOT_BINDING: "1"
        run: npm run build --prefix website/dreary-disk
      - name: Record read-only proof boundary
        run: |
          echo "LIVE_REVISION_LOOKUPS=0"
          echo "V2_EXPORTS=0"
          echo "CI_UPLOAD=NO"
          echo "CI_DEPLOYMENT=NO"
          echo "CI_TRAFFIC_MUTATION=NO"

  scheduled-policy-preflight:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'AUTO_TICK') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish_allowed: ${{ steps.policy.outputs.publish_allowed }}
      breaker_state: ${{ steps.policy.outputs.breaker_state }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate scheduled publish policy before build
        id: policy
        run: |
          python tools/publisher/scheduled_circuit_breaker.py preflight --path publisher-state/scheduled-publish-circuit-breaker.json
          echo "SCHEDULED_PUBLISH_POLICY=VARIABLE_AND_CIRCUIT_BREAKER"
  check-only:
    needs: scheduled-policy-preflight
    if: ${{ always() && ((github.event_name == 'schedule' && (vars.PUBLISHER_MODE_SCHEDULED != 'PUBLISH' || needs.scheduled-policy-preflight.outputs.publish_allowed != 'true')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'AUTO_TICK' && (vars.PUBLISHER_MODE_SCHEDULED != 'PUBLISH' || needs.scheduled-policy-preflight.outputs.publish_allowed != 'true')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'CHECK_ONLY')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLISHER_MODE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'AUTO_TICK')) && (vars.PUBLISHER_MODE_SCHEDULED == 'PUBLISH' && needs.scheduled-policy-preflight.outputs.publish_allowed == 'true' && 'PUBLISH' || 'CHECK_ONLY') || inputs.mode }}
      PUBLISHER_EXPECTED_FINGERPRINT: ${{ inputs.expected_fingerprint }}
      MAHOON_AUTOMATION_SOURCE: ${{ github.event_name == 'schedule' && 'github_schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'AUTO_TICK' && 'cloudflare_cron' || 'manual') }}
      MAHOON_PUBLIC_CONTENT_REVISION_API: https://mahoon-content-revision.morentoofficial.workers.dev/public/content-revision-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'AUTO_TICK')) && 'main' || github.ref }}
      - name: Read revision only; scheduled mode remains CHECK_ONLY
        run: python tools/m9/publisher_runner.py

  build-and-zero-percent:
    needs: scheduled-policy-preflight
    if: false # A6 replaces the combined mutating runner with separated stages below.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      transaction_id: ${{ steps.meta.outputs.transaction_id }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    env:
      PUBLISHER_MODE: BUILD_AND_ZERO_PERCENT
      CLOUDFLARE_ACCOUNT_ID: "773d2dc31655b158d088296a14af5834"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAHOON_WRANGLER: npx wrangler@4.83.0
      MAHOON_PUBLISH_READY: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'AUTO_TICK')) && vars.PUBLISHER_MODE_SCHEDULED == 'PUBLISH' && needs.scheduled-policy-preflight.outputs.publish_allowed == 'true' && 'YES' || inputs.ready }}
      MAHOON_PUBLIC_CONTENT_REVISION_API: https://mahoon-content-revision.morentoofficial.workers.dev/public/content-revision-v1
      MAHOON_AUTOMATION_SOURCE: ${{ github.event_name == 'schedule' && 'github_schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'AUTO_TICK' && 'cloudflare_cron' || 'manual') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'AUTO_TICK')) && 'main' || github.ref }}
      - name: Record scheduled event and execution source SHA
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'AUTO_TICK') }}
        run: |
          echo "SCHEDULE_EVENT_SHA=$GITHUB_SHA"
          execution_sha=$(git rev-parse HEAD)
          echo "EXECUTION_MAIN_SHA=$execution_sha"
          echo "MAHOON_EXECUTION_SHA=$execution_sha" >> "$GITHUB_ENV"
      - name: Require clean main for a controlled transaction
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/dreary-disk/package-lock.json
      - name: Install static-site dependencies
        run: npm ci --prefix website/dreary-disk
      - name: Run publisher and transaction contract tests
        env:
          MAHOON_RUN_BROWSER_TESTS: "0"
          PYTHONPATH: tools/publisher:tools:.
        run: python -m unittest discover -s tools/publisher -p 'test_*.py'
      - name: Build, gate, seal, upload, and create candidate at 0 percent
        run: python tools/m9/publisher_runner.py
      - name: Read transaction identity
        id: meta
        run: |
          python - <<'PY'
          import json, os
          p=json.load(open('runner-evidence/publish-transaction-summary.json', encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"transaction_id={p.get('transaction_id','')}\n")
              f.write(f"source_sha={p.get('source_sha','')}\n")
          print(json.dumps({k:p.get(k) for k in ('transaction_id','source_sha','candidate_version','baseline_version','no_change')}))
          PY
      - name: Upload immutable sanitized proof bundle
        if: ${{ steps.meta.outputs.transaction_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mahoon-publish-proof-bundle-${{ steps.meta.outputs.transaction_id }}
          path: runner-evidence/publish-proof-bundle/
          if-no-files-found: error
          retention-days: 90
      - name: Upload build-gate evidence
        if: ${{ always() && hashFiles('runner-evidence/publish-transaction-summary.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mahoon-publish-build-evidence-${{ github.run_id }}
          path: runner-evidence/publish-transaction-summary.json
          if-no-files-found: ignore
          retention-days: 30

  remote-proof:
    needs: build-and-zero-percent
    if: false # Legacy proof artifacts are no longer current authority.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: "773d2dc31655b158d088296a14af5834"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAHOON_WRANGLER: npx wrangler@4.83.0
    outputs:
      transaction_id: ${{ steps.meta.outputs.transaction_id }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - name: Download the exact immutable transaction bundle
        uses: actions/download-artifact@v4
        with:
          name: mahoon-publish-proof-bundle-${{ (github.event_name == 'schedule' || inputs.mode == 'PUBLISH' || inputs.mode == 'AUTO_TICK') && needs.build-and-zero-percent.outputs.transaction_id || inputs.transaction_id }}
          path: ${{ runner.temp }}/proof-bundle
          run-id: ${{ (github.event_name == 'schedule' || inputs.mode == 'PUBLISH' || inputs.mode == 'AUTO_TICK') && github.run_id || inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Read bundle identity before checkout
        id: meta
        env:
          REQUESTED_TRANSACTION_ID: ${{ (github.event_name == 'schedule' || inputs.mode == 'PUBLISH' || inputs.mode == 'AUTO_TICK') && needs.build-and-zero-percent.outputs.transaction_id || inputs.transaction_id }}
        run: |
          python - <<'PY'
          import json, os
          d=os.path.join(os.environ['RUNNER_TEMP'], 'proof-bundle')
          tx=json.load(open(f'{d}/transaction.json', encoding='utf-8'))
          idx=json.load(open(f'{d}/bundle-index.json', encoding='utf-8'))
          wanted=os.environ.get('REQUESTED_TRANSACTION_ID','')
          assert tx['transaction_id'] == idx['transaction_id']
          assert not wanted or wanted == tx['transaction_id']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"transaction_id={tx['transaction_id']}\nsource_sha={tx['source_sha']}\n")
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/dreary-disk/package-lock.json
      - name: Install browser-gate dependencies
        run: npm ci --prefix website/dreary-disk
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('website/dreary-disk/package-lock.json') }}
      - name: Install Chromium for representative visual proof
        working-directory: website/dreary-disk
        run: npx playwright install --with-deps chromium
      - name: Crawl exact proof-bundle routes and measure candidate
        env:
          PYTHONPATH: tools/publisher:tools:.
        run: >-
          python tools/m9/resumable_stage_runner.py
          --stage REMOTE_PROOF
          --transaction-id "${{ steps.meta.outputs.transaction_id }}"
          --bundle-dir "${{ runner.temp }}/proof-bundle"
      - name: Upload measured remote proof, including failures
        if: ${{ always() && steps.meta.outputs.transaction_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mahoon-remote-proof-result-${{ steps.meta.outputs.transaction_id }}
          path: runner-evidence/remote-proof-result.json
          if-no-files-found: warn
          retention-days: 90

  promote-and-validate:
    needs: [scheduled-policy-preflight, build-and-zero-percent, remote-proof]
    if: false # Legacy combined promotion path is disabled by A6.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      production_pass: ${{ steps.result.outputs.production_pass }}
      transaction_id: ${{ steps.meta.outputs.transaction_id }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    env:
      CLOUDFLARE_ACCOUNT_ID: "773d2dc31655b158d088296a14af5834"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAHOON_WRANGLER: npx wrangler@4.83.0
      MAHOON_PUBLISH_READY: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'AUTO_TICK')) && vars.PUBLISHER_MODE_SCHEDULED == 'PUBLISH' && needs.scheduled-policy-preflight.outputs.publish_allowed == 'true' && 'YES' || inputs.ready }}
    steps:
      - name: Download the matching build proof bundle
        uses: actions/download-artifact@v4
        with:
          name: mahoon-publish-proof-bundle-${{ (github.event_name == 'schedule' || inputs.mode == 'PUBLISH' || inputs.mode == 'AUTO_TICK') && needs.build-and-zero-percent.outputs.transaction_id || inputs.transaction_id }}
          path: ${{ runner.temp }}/proof-bundle
          run-id: ${{ (github.event_name == 'schedule' || inputs.mode == 'PUBLISH' || inputs.mode == 'AUTO_TICK') && github.run_id || inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Download the remote proof result
        uses: actions/download-artifact@v4
        with:
          name: mahoon-remote-proof-result-${{ (github.event_name == 'schedule' || inputs.mode == 'PUBLISH' || inputs.mode == 'AUTO_TICK') && needs.remote-proof.outputs.transaction_id || inputs.transaction_id }}
          path: ${{ runner.temp }}/remote-proof
          run-id: ${{ (github.event_name == 'schedule' || inputs.mode == 'PUBLISH' || inputs.mode == 'AUTO_TICK') && github.run_id || inputs.source_proof_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - name: Read transaction identity before checkout
        id: meta
        env:
          REQUESTED_TRANSACTION_ID: ${{ (github.event_name == 'schedule' || inputs.mode == 'PUBLISH' || inputs.mode == 'AUTO_TICK') && needs.build-and-zero-percent.outputs.transaction_id || inputs.transaction_id }}
        run: |
          python - <<'PY'
          import json, os
          import os
          root=os.environ['RUNNER_TEMP']
          tx=json.load(open(f'{root}/proof-bundle/transaction.json', encoding='utf-8'))
          proof=json.load(open(f'{root}/remote-proof/remote-proof-result.json', encoding='utf-8'))
          wanted=os.environ.get('REQUESTED_TRANSACTION_ID','')
          assert tx['transaction_id'] == proof['transaction_id'] == wanted
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"transaction_id={tx['transaction_id']}\nsource_sha={tx['source_sha']}\n")
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/dreary-disk/package-lock.json
      - name: Install browser-gate dependencies
        run: npm ci --prefix website/dreary-disk
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('website/dreary-disk/package-lock.json') }}
      - name: Install Chromium for production visual validation
        working-directory: website/dreary-disk
        run: npx playwright install --with-deps chromium
      - name: Verify proof, check live split, promote Static-to-Static, and validate production
        env:
          PYTHONPATH: tools/publisher:tools:.
        run: >-
          python tools/m9/resumable_stage_runner.py
          --stage PROMOTE_AND_VALIDATE
          --transaction-id "${{ steps.meta.outputs.transaction_id }}"
          --bundle-dir "${{ runner.temp }}/proof-bundle"
          --proof-dir "${{ runner.temp }}/remote-proof"
      - name: Read production pass marker
        id: result
        if: ${{ always() }}
        run: |
          if test -f runner-evidence/production-result.json && python -c "import json; raise SystemExit(0 if json.load(open('runner-evidence/production-result.json', encoding='utf-8')).get('PASS') is True else 1)"; then
            echo "production_pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "production_pass=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload production result and persistence payload
        if: ${{ always() && hashFiles('runner-evidence/production-result.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mahoon-production-result-${{ steps.meta.outputs.transaction_id }}
          path: |
            runner-evidence/production-result.json
            runner-evidence/published-state/
          if-no-files-found: warn
          retention-days: 90

  persist-state:
    needs: promote-and-validate
    if: false # Replaced by accepted final-persistence-execute boundary.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified production result
        uses: actions/download-artifact@v4
        with:
          name: mahoon-production-result-${{ needs.promote-and-validate.outputs.transaction_id }}
          path: ${{ runner.temp }}/production-result
      - name: Download corresponding proof bundle
        uses: actions/download-artifact@v4
        with:
          name: mahoon-publish-proof-bundle-${{ needs.promote-and-validate.outputs.transaction_id }}
          path: ${{ runner.temp }}/proof-bundle
          run-id: ${{ (github.event_name == 'schedule' || inputs.mode == 'PUBLISH' || inputs.mode == 'AUTO_TICK') && github.run_id || inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.promote-and-validate.outputs.source_sha }}
      - name: Verify PASS artifacts and install only transaction state
        env:
          PYTHONPATH: tools/publisher:tools:.
        run: python tools/m9/persist_publisher_state.py --bundle-dir "${{ runner.temp }}/proof-bundle" --result-dir "${{ runner.temp }}/production-result"
      - name: Persist only verified publisher state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publisher-state/production-content-fingerprint.json publisher-state/production-media-manifest.json
          git add publisher-state/immutable-media-index.json publisher-state/published-route-manifest.json
          git add publisher-state/current-accepted-route-manifest.json publisher-state/published-static-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist verified static publisher state"
            git push origin HEAD:main
          fi

  scheduled-circuit-breaker:
    needs: [scheduled-policy-preflight, build-and-zero-percent, remote-proof, promote-and-validate, persist-state]
    if: false # Legacy job outcomes do not describe the A6 stage graph.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Open breaker after a scheduled transaction failure
        env:
          PREFLIGHT_STATE: ${{ needs.scheduled-policy-preflight.outputs.breaker_state }}
          BUILD_RESULT: ${{ needs.build-and-zero-percent.result }}
          REMOTE_RESULT: ${{ needs.remote-proof.result }}
          PROMOTION_RESULT: ${{ needs.promote-and-validate.result }}
          PERSIST_RESULT: ${{ needs.persist-state.result }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          failed_job=""
          if [ "$BUILD_RESULT" = "failure" ] || [ "$BUILD_RESULT" = "cancelled" ]; then failed_job="build-and-zero-percent"; fi
          if [ -z "$failed_job" ] && { [ "$REMOTE_RESULT" = "failure" ] || [ "$REMOTE_RESULT" = "cancelled" ]; }; then failed_job="remote-proof"; fi
          if [ -z "$failed_job" ] && { [ "$PROMOTION_RESULT" = "failure" ] || [ "$PROMOTION_RESULT" = "cancelled" ]; }; then failed_job="promote-and-validate"; fi
          if [ -z "$failed_job" ] && { [ "$PERSIST_RESULT" = "failure" ] || [ "$PERSIST_RESULT" = "cancelled" ]; }; then failed_job="persist-state"; fi
          if [ "$PREFLIGHT_STATE" != "CLOSED" ] || [ -z "$failed_job" ]; then
            echo "scheduled breaker unchanged: state=$PREFLIGHT_STATE failed_job=$failed_job"
            exit 0
          fi
          python tools/publisher/scheduled_circuit_breaker.py open \
            --path publisher-state/scheduled-publish-circuit-breaker.json \
            --run-id "$RUN_ID" \
            --failed-job "$failed_job" \
            --head-sha "$HEAD_SHA" \
            --reason "scheduled run $RUN_ID ended $failed_job with failure/cancelled result"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publisher-state/scheduled-publish-circuit-breaker.json
          git diff --cached --quiet || git commit -m "chore: open scheduled publisher circuit breaker"
          git push origin HEAD:main

  # A6 source-pinned, artifact-carried transaction stages.
  journal-bootstrap:
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && !(github.event_name == 'workflow_dispatch' && (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE' || inputs.mode == 'RETIRE_STALE_ADMITTED' || inputs.mode == 'BROWSER_DIAGNOSTIC')) }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.sha }}', path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Bootstrap durable journal
        run: python code/tools/publisher/workflow_stage_cli.py bootstrap-journal --repository state --worker mahoon-art-magazine --remote origin --branch main

  journal-resume-verify:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state, persist-credentials: false }
      - name: Verify pristine admission or the exact in-flight APPLIED transaction without writing state
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_TRANSACTION_ID: ${{ inputs.transaction_id }}
          REQUESTED_READY: ${{ inputs.ready }}
          REQUESTED_RESUME_SOURCE_SHA: ${{ inputs.resume_source_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RESUME_SOURCE_RUN_ID: ${{ inputs.resume_source_run_id }}
        run: |
          python - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          mode = os.environ.get("REQUESTED_MODE", "RESUME_ADMITTED")
          assert mode in {"RESUME_ADMITTED", "POST_PROMOTION_FINALIZE"}, "unsupported resume mode"
          post_finalize = mode == "POST_PROMOTION_FINALIZE"
          tx_id = os.environ["REQUESTED_TRANSACTION_ID"]
          ready = os.environ["REQUESTED_READY"]
          resume_sha = os.environ["REQUESTED_RESUME_SOURCE_SHA"]
          source_run_id = os.environ["SOURCE_RUN_ID"]
          resume_source_run_id = os.environ.get("RESUME_SOURCE_RUN_ID", "")
          assert ready == "YES", "RESUME requires explicit ready=YES"
          assert tx_id and len(tx_id) == 64 and all(c in "0123456789abcdef" for c in tx_id), \
              "RESUME transaction_id must be a 64-hex-digit SHA-256"
          assert resume_sha and len(resume_sha) == 40 and all(c in "0123456789abcdef" for c in resume_sha), \
              "resume_source_sha must be a 40-hex-digit executable source SHA-1"
          assert source_run_id.isdecimal() and int(source_run_id) > 0, "source_run_id must be a positive run ID"
          in_flight = resume_source_run_id not in ("", "0")
          assert not post_finalize or in_flight, "post-promotion finalization requires an in-flight source run"
          if in_flight:
              assert resume_source_run_id.isdecimal() and int(resume_source_run_id) > 0, \
                  "resume_source_run_id must be a positive run ID"
              assert resume_source_run_id == source_run_id, \
                  "in-flight resume source_run_id must match resume_source_run_id"
          journal = json.loads(Path("state/publisher-state/production-transaction-journal.json").read_text(encoding="utf-8"))
          active = journal["active"]
          assert journal["pending"] is None, "pending transaction must be empty for resume"
          assert active is not None, "no active transaction"
          assert active["logical_transaction_id"] == tx_id, \
              f"requested transaction {tx_id} does not match active transaction {active['logical_transaction_id']}"
          assert active["worker"] == "mahoon-art-magazine", "worker mismatch"
          revision = active["content_revision"]
          generation = journal["generation"]
          tx_recomputed = hashlib.sha256(f"mahoon-art-magazine\0{revision}".encode("utf-8")).hexdigest()
          assert active["logical_transaction_id"] == tx_recomputed, \
              "active transaction ID does not match worker/revision"
          assert active["proof_evidence_sha256"] is None, "proof evidence already set"
          assert active["state_commit_sha"] is None, "state commit already set"
          operations = active["operations"]
          assert set(operations) == {"upload_version", "deploy_zero_percent", "promote", "rollback"}, \
              "active operation set is not the accepted publisher transaction"
          def valid_sha(value):
              return isinstance(value, str) and len(value) == 64 and all(c in "0123456789abcdef" for c in value)
          promote = operations["promote"]
          promote_attempts = promote["attempts"]
          post_promotion_pending = (
              post_finalize and in_flight and active["state"] == "intent_recorded"
              and active["recovery_status"] == "NONE"
              and promote["intent_state"] == "RECORDED"
              and promote["result_state"] == "NOT_REPORTED"
              and len(promote_attempts) == 2
              and promote_attempts[0].get("attempt_number") == 1
              and promote_attempts[0].get("intent_state") == "RECORDED"
              and promote_attempts[0].get("result_state") == "NOT_APPLIED"
              and valid_sha(promote_attempts[0].get("intent_artifact_sha256"))
              and valid_sha(promote_attempts[0].get("result_digest"))
              and promote_attempts[1].get("attempt_number") == 2
              and promote_attempts[1].get("intent_state") == "RECORDED"
              and promote_attempts[1].get("result_state") == "NOT_REPORTED"
              and valid_sha(promote_attempts[1].get("intent_artifact_sha256"))
              and promote_attempts[1].get("result_digest") is None
          )
          reconciled_promote_retry = (
              in_flight and active["state"] == "operation_reported"
              and active["recovery_status"] == "RECONCILED_NOT_APPLIED"
              and promote["intent_state"] == "RECORDED"
              and promote["result_state"] == "NOT_APPLIED"
              and len(promote_attempts) == 1
              and promote_attempts[0].get("attempt_number") == 1
              and promote_attempts[0].get("intent_state") == "RECORDED"
              and promote_attempts[0].get("result_state") == "NOT_APPLIED"
              and valid_sha(promote_attempts[0].get("intent_artifact_sha256"))
              and valid_sha(promote_attempts[0].get("result_digest"))
          )
          assert active["recovery_status"] == "NONE" or reconciled_promote_retry, \
              "recovery is not a single reconciled-not-applied promotion"
          if in_flight:
              if post_finalize:
                  assert post_promotion_pending, "journal is not the exact pending APPLIED-promotion finalization state"
              else:
                  assert active["state"] == "operation_reported", \
                      f"active state is {active['state']}, not operation_reported"
              assert valid_sha(active["build_bundle_sha256"]), "in-flight build bundle digest is missing or invalid"
              for name in ("upload_version", "deploy_zero_percent"):
                  op = operations[name]
                  assert op["intent_state"] == "RECORDED" and op["result_state"] == "APPLIED", \
                      f"operation {name} is not exactly recorded as APPLIED"
                  assert len(op["attempts"]) == 1, f"operation {name} must have exactly one recorded attempt"
                  attempt = op["attempts"][0]
                  assert attempt["attempt_number"] == 1 and attempt["intent_state"] == "RECORDED" \
                      and attempt["result_state"] == "APPLIED", f"operation {name} attempt is not APPLIED"
                  assert valid_sha(attempt["intent_artifact_sha256"]) and valid_sha(attempt["result_digest"]), \
                      f"operation {name} attempt evidence is incomplete"
              for name in ("promote", "rollback"):
                  op = operations[name]
                  if name == "promote" and (reconciled_promote_retry or post_promotion_pending):
                      continue
                  assert op["attempts"] == [] and op["intent_state"] == "NOT_STARTED" \
                      and op["result_state"] == "NOT_REPORTED", f"operation {name} has progress"
              resume_kind = ("POST_PROMOTION_FINALIZATION_PENDING" if post_promotion_pending else
                             "IN_FLIGHT_RECONCILED_PROMOTE_RETRY" if reconciled_promote_retry else
                             "IN_FLIGHT_APPLIED")
          else:
              assert active["state"] == "admitted", f"active state is {active['state']}, not admitted"
              assert active["build_bundle_sha256"] is None, "build bundle already set"
              for name in ("upload_version", "deploy_zero_percent", "promote", "rollback"):
                  op = operations[name]
                  assert op["attempts"] == [], f"operation {name} has recorded attempts"
                  assert op["intent_state"] == "NOT_STARTED", f"operation {name} intent already recorded"
                  assert op["result_state"] == "NOT_REPORTED", f"operation {name} result already reported"
              resume_kind = "PRISTINE_ADMITTED"
          print(f"RESUME_JOURNAL={resume_kind}; REVISION={revision}; GENERATION={generation}")
          PY

  revision-resolve:
    needs: [journal-bootstrap, journal-resume-verify]
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && needs.journal-resume-verify.result == 'success') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && !(github.event_name == 'workflow_dispatch' && (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE')) && needs.journal-bootstrap.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state, persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Download the immutable revision artifact from the admitted run
        if: ${{ inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE' }}
        uses: actions/download-artifact@v4
        with:
          name: a6-revision-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/resume-revision
          run-id: ${{ inputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Revalidate and carry forward the original revision artifact unchanged
        if: ${{ inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE' }}
        env:
          REQUESTED_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RESUME_SOURCE_RUN_ID: ${{ inputs.resume_source_run_id }}
          REQUESTED_SOURCE_SHA: ${{ inputs.resume_source_sha }}
          REQUESTED_TRANSACTION_ID: ${{ inputs.transaction_id }}
        run: |
          PYTHONPATH=code/tools/publisher:code/tools:code python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          from publisher import artifact_contract
          from publisher.content_revision import fetch_public_content_revision
          source_sha = os.environ["REQUESTED_SOURCE_SHA"]
          tx_id = os.environ["REQUESTED_TRANSACTION_ID"]
          source_run_id = os.environ["REQUESTED_SOURCE_RUN_ID"]
          resume_source_run_id = os.environ.get("RESUME_SOURCE_RUN_ID", "")
          in_flight = resume_source_run_id not in ("", "0")
          if in_flight:
              assert resume_source_run_id == source_run_id, \
                  "in-flight resume source_run_id must match resume_source_run_id"
          assert source_sha and len(source_sha) == 40 and all(c in "0123456789abcdef" for c in source_sha), \
              "resume_source_sha must be a 40-hex-digit SHA-1"
          journal = json.loads(Path("state/publisher-state/production-transaction-journal.json").read_text(encoding="utf-8"))
          active = journal["active"]
          assert active is not None, "no active transaction"
          assert active["logical_transaction_id"] == tx_id, \
              f"requested transaction {tx_id} does not match active transaction {active['logical_transaction_id']}"
          active_revision = active["content_revision"]
          original = Path(os.environ["RUNNER_TEMP"]) / "resume-revision" / "revision-resolution.json"
          raw = original.read_bytes()
          artifact = artifact_contract.validate_artifact(json.loads(raw), expected_source_sha=source_sha)
          assert artifact["artifact_type"] == "revision_resolution"
          assert artifact["transaction"]["logical_transaction_id"] == tx_id, \
              "revision artifact transaction does not match requested transaction"
          artifact_revision = artifact["payload"]["revision"]
          assert artifact_revision == active_revision, \
              f"artifact revision {artifact_revision} does not match active journal revision {active_revision}"
          assert artifact["payload"]["decision"] == "CHANGED", "revision decision is not CHANGED"
          public_revision, _changed_at, _meta = fetch_public_content_revision()
          if in_flight:
              assert public_revision >= active_revision, \
                  f"RESUME_PUBLIC_REVISION_BEHIND:public={public_revision} active={active_revision}"
          else:
              assert public_revision == active_revision, \
                  f"RESUME_PUBLIC_REVISION_MISMATCH:public={public_revision} admitted={active_revision}"
          shutil.copyfile(original, "revision-resolution.json")
          print(f"RESUME_REVISION_ARTIFACT=UNCHANGED; PUBLIC_REVISION={public_revision}; ACTIVE_REVISION={active_revision}; IN_FLIGHT={in_flight}; GENERATION={journal['generation']}")
          PY
      - name: Resolve revision for a new transaction
        if: ${{ inputs.mode != 'RESUME_ADMITTED' && inputs.mode != 'POST_PROMOTION_FINALIZE' }}
        run: python code/tools/publisher/workflow_stage_cli.py resolve-revision --published-state state/publisher-state/production-content-fingerprint.json --output revision-resolution.json
      - uses: actions/upload-artifact@v4
        with:
          name: a6-revision-${{ github.run_id }}
          path: revision-resolution.json
          if-no-files-found: error

  admission:
    needs: [scheduled-policy-preflight, revision-resolve]
    if: ${{ always() && needs.revision-resolve.result == 'success' && ((github.event_name == 'schedule' && vars.PUBLISHER_MODE_SCHEDULED == 'PUBLISH' && needs.scheduled-policy-preflight.outputs.publish_allowed == 'true') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'PUBLISH' && inputs.ready == 'YES') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'PROMOTE_AND_VALIDATE' && inputs.ready == 'YES') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'AUTO_TICK' && vars.PUBLISHER_MODE_SCHEDULED == 'PUBLISH' && needs.scheduled-policy-preflight.outputs.publish_allowed == 'true')) }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs:
      decision: ${{ steps.admit-reuse.outputs.decision || steps.admit.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-revision-${{ github.run_id }}', path: handoff }
      - name: Download the source run's sealed admission for an in-flight resume
        if: ${{ inputs.resume_source_run_id != '' && inputs.resume_source_run_id != null && inputs.resume_source_run_id != '0' }}
        uses: actions/download-artifact@v4
        with:
          name: a6-admission-${{ inputs.resume_source_run_id }}
          path: handoff
          run-id: ${{ inputs.resume_source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Reuse the source run's sealed admission (in-flight resume)
        id: admit-reuse
        if: ${{ inputs.resume_source_run_id != '' && inputs.resume_source_run_id != null && inputs.resume_source_run_id != '0' }}
        env:
          PYTHONPATH: code/tools/publisher:code/tools:code
        run: |
          mkdir -p runner-evidence/a6
          python - <<'PY'
          import os, json, shutil
          from pathlib import Path
          from publisher import artifact_transport
          revision = artifact_transport.read_artifact(Path("handoff/revision-resolution.json"), expected_type="revision_resolution")
          raw = Path("handoff/admission.json").read_bytes()
          admission = json.loads(raw)
          # Revalidate the source admission envelope against this run's revision.
          admission = artifact_transport.read_artifact(Path("handoff/admission.json"), expected_type="admission_receipt", expected_transaction=revision["transaction"], referenced_artifacts=artifact_transport.references(revision))
          Path("runner-evidence/a6/admission.json").write_bytes(raw)
          print(f"REUSED_SOURCE_ADMISSION=gen{admission['payload']['journal_generation']} decision={admission['payload']['decision']} sha={admission['artifact_sha256'][:16]}")
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'decision={admission["payload"]["decision"]}\n')
          PY
      - name: Mint a fresh admission (non-resume path)
        id: admit
        if: ${{ inputs.resume_source_run_id == '' || inputs.resume_source_run_id == null || inputs.resume_source_run_id == '0' }}
        run: |
          mkdir -p runner-evidence/a6
          python code/tools/publisher/workflow_stage_cli.py admit --revision handoff/revision-resolution.json --repository state --source '${{ github.event_name }}' --run-id '${{ github.run_id }}' --trigger-attempt '${{ github.run_attempt }}' --output runner-evidence/a6/admission.json | tee admission-status.json
          python -c "import json,os; d=json.load(open('admission-status.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('decision='+d['status']+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: a6-admission-${{ github.run_id }}
          path: runner-evidence/a6/admission.json
          if-no-files-found: error

  resume-admission:
    needs: [journal-resume-verify, revision-resolve]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && needs.journal-resume-verify.result == 'success' && needs.revision-resolve.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    outputs:
      decision: ${{ steps.admit.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state, persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-revision-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with:
          name: a6-admission-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/resume-admission
          run-id: ${{ inputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: admit
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.resume_source_sha }}
          REQUESTED_TRANSACTION_ID: ${{ inputs.transaction_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RESUME_SOURCE_RUN_ID: ${{ inputs.resume_source_run_id }}
        run: |
          PYTHONPATH=code/tools/publisher:code/tools:code python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from publisher import artifact_contract, artifact_transport
          source_sha = os.environ["REQUESTED_SOURCE_SHA"]
          tx_id = os.environ["REQUESTED_TRANSACTION_ID"]
          source_run_id = os.environ["SOURCE_RUN_ID"]
          resume_source_run_id = os.environ.get("RESUME_SOURCE_RUN_ID", "")
          in_flight = resume_source_run_id not in ("", "0")
          if in_flight:
              assert resume_source_run_id == source_run_id, \
                  "in-flight resume source_run_id must match resume_source_run_id"
          revision_path = Path("handoff/revision-resolution.json")
          original = Path(os.environ["RUNNER_TEMP"]) / "resume-admission" / "admission.json"
          raw = original.read_bytes()
          journal = json.loads(Path("state/publisher-state/production-transaction-journal.json").read_text(encoding="utf-8"))
          active = journal["active"]
          assert active is not None, "no active transaction"
          assert active["logical_transaction_id"] == tx_id, \
              f"requested transaction {tx_id} does not match active transaction {active['logical_transaction_id']}"
          current_generation = journal["generation"]
          revision = artifact_transport.read_artifact(revision_path, expected_type="revision_resolution", expected_source_sha=source_sha)
          admission = artifact_contract.validate_artifact(
              json.loads(raw), expected_transaction=revision["transaction"], expected_source_sha=source_sha,
              expected_journal_generation=None if in_flight else current_generation,
              referenced_artifacts=artifact_transport.references(revision),
          )
          assert admission["artifact_type"] == "admission_receipt"
          assert admission["payload"]["decision"] in ({"ADMITTED", "COALESCED"} if in_flight else {"ADMITTED"}), \
              "source admission decision is not accepted for this resume path"
          admission_generation = admission["payload"]["journal_generation"]
          if in_flight:
              # The original sealed admission predates the journaled APPLIED attempts.
              assert admission_generation <= current_generation, \
                  "in-flight admission generation is newer than the authoritative journal"
          else:
              assert admission_generation == current_generation, \
                  "admission journal generation does not match current authoritative generation"
          assert admission["payload"]["revision_resolution_sha256"] == revision["artifact_sha256"], \
              "admission lineage does not match recovered revision artifact"
          assert admission["payload"]["active_transaction_id"] == tx_id
          assert admission["transaction"]["logical_transaction_id"] == tx_id
          Path("runner-evidence/a6").mkdir(parents=True, exist_ok=True)
          shutil.copyfile(original, "runner-evidence/a6/admission.json")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("decision=ADMITTED\n")
          PY
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-admission-${{ github.run_id }}', path: runner-evidence/a6/admission.json, if-no-files-found: error }

  build-validate:
    needs: [admission, resume-admission]
    if: ${{ always() && (((inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && needs.resume-admission.result == 'success' && needs.resume-admission.outputs.decision == 'ADMITTED') || (inputs.mode != 'RESUME_ADMITTED' && needs.admission.result == 'success' && needs.admission.outputs.decision == 'ADMITTED') || (inputs.mode != 'RESUME_ADMITTED' && needs.admission.result == 'success' && needs.admission.outputs.decision == 'COALESCED' && (inputs.resume_source_run_id == '' || inputs.resume_source_run_id == null || inputs.resume_source_run_id == '0')) || (inputs.resume_source_run_id != '' && inputs.resume_source_run_id != null && inputs.resume_source_run_id != '0' && needs.admission.result == 'success' && needs.admission.outputs.decision == 'COALESCED')) }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-revision-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-admission-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Download the source run's sealed build for an in-flight resume
        if: ${{ inputs.resume_source_run_id != '' && inputs.resume_source_run_id != null && inputs.resume_source_run_id != '0' }}
        uses: actions/download-artifact@v4
        with:
          name: a6-build-${{ inputs.resume_source_run_id }}
          path: handoff
          run-id: ${{ inputs.resume_source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Revalidate the source run's build lineage against the active journal
        if: ${{ inputs.resume_source_run_id != '' && inputs.resume_source_run_id != null && inputs.resume_source_run_id != '0' }}
        env:
          PYTHONPATH: code/tools/publisher:code/tools:code
          RESUME_SOURCE_RUN_ID: ${{ inputs.resume_source_run_id }}
          SOURCE_ADMISSION_SHA: ${{ inputs.resume_source_admission_sha }}
          RESUME_MODE: ${{ inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE' }}
          POST_PROMOTION_FINALIZE: ${{ inputs.mode == 'POST_PROMOTION_FINALIZE' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from publisher import artifact_contract, artifact_transport
          active = json.loads(Path("state/publisher-state/production-transaction-journal.json").read_text(encoding="utf-8"))["active"]
          assert active is not None, "no active transaction to resume"
          revision = artifact_transport.read_artifact(Path("handoff/revision-resolution.json"), expected_type="revision_resolution")
          refs = artifact_transport.references(revision)
          admission = artifact_transport.read_artifact(Path("handoff/admission.json"), expected_type="admission_receipt", expected_transaction=revision["transaction"], referenced_artifacts=refs)
          bundle = artifact_transport.read_artifact(Path("handoff/runner-evidence/v1-build-bundle.json"), expected_type="build_bundle", referenced_artifacts=refs)
          assert admission["payload"]["active_transaction_id"] == active["logical_transaction_id"], "resume admission does not target the active transaction"
          current_gen = json.loads(Path("state/publisher-state/production-transaction-journal.json").read_text(encoding="utf-8"))["generation"]
          assert admission["payload"]["decision"] in {"ADMITTED", "COALESCED"}, \
              f"resume admission decision is {admission['payload']['decision']}, not ADMITTED or COALESCED"
          assert admission["payload"]["journal_generation"] >= 1, \
              f"resume admission generation {admission['payload']['journal_generation']} is invalid"
          allowed_states = {"operation_reported", "build_ready"}
          if os.environ.get("POST_PROMOTION_FINALIZE", "false").lower() == "true":
              allowed_states.add("intent_recorded")
          assert active["state"] in allowed_states, f"resume requires a resumable active state, got {active['state']}"
          assert bundle["transaction"] == admission["transaction"] and admission["artifact_sha256"] == bundle["payload"]["admission_receipt_sha256"], "resume build bundle does not seal the source admission"
          if os.environ.get("SOURCE_ADMISSION_SHA"):
              assert admission["artifact_sha256"] == os.environ["SOURCE_ADMISSION_SHA"], "resume admission seal drifted"
          from publisher.content_revision import fetch_public_content_revision
          current, _changed_at, _metadata = fetch_public_content_revision()
          if os.environ.get("RESUME_MODE", "false").lower() == "true":
              assert current >= active["content_revision"], \
                  f"PUBLIC_REVISION_BEHIND:{current}<{active['content_revision']}"
          else:
              assert current == active["content_revision"], f"PUBLIC_REVISION_DRIFT:{current}!={active['content_revision']}"
          print(f"RESUME_CARRIED_FORWARD=run{os.environ['RESUME_SOURCE_RUN_ID']} rev{active['content_revision']} tx{active['logical_transaction_id'][:16]}")
          PY
      - name: Validate current admission and public revision before build
        if: ${{ inputs.resume_source_run_id == '' || inputs.resume_source_run_id == null || inputs.resume_source_run_id == '0' }}
        env:
          PYTHONPATH: code/tools/publisher:code/tools:code
          EXECUTION_SHA: ${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}
          RESUME_MODE: ${{ inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from publisher import artifact_transport
          from publisher.content_revision import fetch_public_content_revision
          source = os.environ['EXECUTION_SHA']
          revision = artifact_transport.read_artifact('handoff/revision-resolution.json', expected_type='revision_resolution', expected_source_sha=source)
          admission = artifact_transport.read_artifact('handoff/admission.json', expected_type='admission_receipt', expected_transaction=revision['transaction'], expected_source_sha=source, referenced_artifacts=artifact_transport.references(revision))
          assert revision['payload']['decision'] == 'CHANGED'
          # COALESCED is valid when mark_terminal promoted a pending tx to active admitted
          # and the PUBLISH re-admits the same tx, landing in a clean admitted state.
          assert admission['payload']['decision'] in {'ADMITTED', 'COALESCED'}
          assert admission['transaction']['logical_transaction_id'] == revision['transaction']['logical_transaction_id']
          assert admission['payload']['active_transaction_id'] == revision['transaction']['logical_transaction_id']
          assert admission['payload']['revision_resolution_sha256'] == revision['artifact_sha256']
          journal = json.loads(Path('state/publisher-state/production-transaction-journal.json').read_text(encoding='utf-8'))
          active = journal['active']
          assert active and active['logical_transaction_id'] == revision['transaction']['logical_transaction_id'] and active['state'] in {'admitted', 'build_ready'}
          if admission['payload']['decision'] == 'COALESCED':
              # COALESCED is legal when the active tx has no operation progress,
              # whether it was admitted fresh or already advanced to build_ready
              # by a prior partial PUBLISH that stopped at upload-intent-write.
              assert active['state'] in {'admitted', 'build_ready'}, f"COALESCED admission requires clean active state, got {active['state']}"
              for op in active['operations'].values():
                  assert op['result_state'] == 'NOT_REPORTED' and op['attempts'] == [], "COALESCED active tx has operation progress; not a clean post-mark_terminal state"
          current, _changed_at, _meta = fetch_public_content_revision()
          if os.environ['RESUME_MODE'].lower() == 'true':
              assert current == revision['payload']['revision'], f'RESUME_PUBLIC_REVISION_MISMATCH:{current}'
          assert current == revision['payload']['revision'], f'PUBLIC_REVISION_CHANGED_BEFORE_BUILD:{current}'
          print(f"PRE_BUILD_REVISION_STABLE={current}")
          PY
      - uses: actions/setup-node@v4
        if: ${{ inputs.resume_source_run_id == '' || inputs.resume_source_run_id == null || inputs.resume_source_run_id == '0' }}
        with: { node-version: 22 }
      - run: npm ci --prefix code/website/dreary-disk
        if: ${{ inputs.resume_source_run_id == '' || inputs.resume_source_run_id == null || inputs.resume_source_run_id == '0' }}
      - name: Build and validate without Cloudflare credentials
        if: ${{ inputs.resume_source_run_id == '' || inputs.resume_source_run_id == null || inputs.resume_source_run_id == '0' }}
        env:
          PYTHONPATH: code/tools/publisher:code/tools:code
          PUBLISHER_MODE: BUILD_VALIDATE
          MAHOON_EXECUTION_SHA: ${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}
          MAHOON_REVISION_RESOLUTION_ARTIFACT: ../handoff/revision-resolution.json
          MAHOON_ADMISSION_RECEIPT_ARTIFACT: ../handoff/admission.json
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: cd code && python tools/m9/publisher_runner.py
      - name: Recheck public content revision before build artifact handoff
        if: ${{ inputs.resume_source_run_id == '' || inputs.resume_source_run_id == null || inputs.resume_source_run_id == '0' }}
        env:
          PYTHONPATH: code/tools/publisher:code/tools:code
          EXECUTION_SHA: ${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}
          RESUME_MODE: ${{ inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE' }}
          MAHOON_PUBLIC_CONTENT_REVISION_API: https://mahoon-content-revision.morentoofficial.workers.dev/public/content-revision-v1
        run: |
          python - <<'PY'
          import os
          from publisher import artifact_transport
          from publisher.content_revision import fetch_public_content_revision
          source = os.environ['EXECUTION_SHA']
          revision = artifact_transport.read_artifact('handoff/revision-resolution.json', expected_type='revision_resolution', expected_source_sha=source)
          current, _changed_at, _meta = fetch_public_content_revision()
          if os.environ['RESUME_MODE'].lower() == 'true':
              assert current == revision['payload']['revision'], f'RESUME_PUBLIC_REVISION_MISMATCH:{current}'
          assert current == revision['payload']['revision'], f'PUBLIC_REVISION_CHANGED_DURING_BUILD:{current}'
          print(f"POST_BUILD_REVISION_STABLE={current}")
          PY
      - name: Upload the sealed build bundle
        if: ${{ inputs.resume_source_run_id == '' || inputs.resume_source_run_id == null || inputs.resume_source_run_id == '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: a6-build-${{ github.run_id }}
          include-hidden-files: true
          path: |
            code/runner-evidence/publisher-sealed/
            code/runner-evidence/v1-build-bundle.json
            code/runner-evidence/current-v2-snapshot.json
            code/runner-evidence/prepromotion-local-gates.json
            code/runner-build/production-media-manifest.json
            code/runner-build/published-route-manifest.json
          if-no-files-found: error

  build-ready-write:
    needs: build-validate
    if: ${{ !cancelled() && ((inputs.mode == 'PUBLISH' || inputs.mode == 'PROMOTE_AND_VALIDATE') && needs.build-validate.result == 'success' && needs.admission.result == 'success') || ((inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && needs.build-validate.result == 'success' && needs.resume-admission.result == 'success' && needs.resume-admission.outputs.decision == 'ADMITTED') }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - name: Download the source run's sealed build bundle (in-flight resume)
        if: ${{ inputs.resume_source_run_id != '' && inputs.resume_source_run_id != null && inputs.resume_source_run_id != '0' }}
        uses: actions/download-artifact@v4
        with:
          name: a6-build-${{ inputs.resume_source_run_id }}
          path: handoff
          run-id: ${{ inputs.resume_source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the source run's sealed admission (in-flight resume)
        if: ${{ inputs.resume_source_run_id != '' && inputs.resume_source_run_id != null && inputs.resume_source_run_id != '0' }}
        uses: actions/download-artifact@v4
        with:
          name: a6-admission-${{ inputs.resume_source_run_id }}
          path: handoff
          run-id: ${{ inputs.resume_source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore and verify the source route manifest if artifact transport omitted it
        if: ${{ inputs.resume_source_run_id != '' && inputs.resume_source_run_id != null && inputs.resume_source_run_id != '0' }}
        env:
          PYTHONPATH: code/tools/publisher:code/tools:code
          RESUME_SOURCE_SHA: ${{ inputs.resume_source_sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from publisher.artifact_transport import read_artifact
          from publisher.candidate_route_manifest import build_candidate_route_manifest

          bundle = read_artifact(
              "handoff/runner-evidence/v1-build-bundle.json",
              expected_type="build_bundle",
              expected_source_sha=os.environ["RESUME_SOURCE_SHA"],
          )
          route_path = Path("handoff/runner-build/published-route-manifest.json")
          expected_route_sha = bundle["payload"]["route_manifest_sha256"]
          if not route_path.is_file():
              snapshot_path = Path("handoff/runner-evidence/current-v2-snapshot.json")
              snapshot_bytes = snapshot_path.read_bytes()
              assert hashlib.sha256(snapshot_bytes).hexdigest() == bundle["payload"]["snapshot_sha256"]
              snapshot = json.loads(snapshot_bytes)
              assert snapshot.get("contract") == "POSTS_FULL_PUBLIC_SNAPSHOT_V2"
              assert isinstance(snapshot.get("payload", {}).get("posts"), list)
              build_candidate_route_manifest(
                  snapshot["payload"]["posts"],
                  Path("code/publisher-state/current-accepted-route-manifest.json"),
                  route_path,
              )
          actual_route_sha = hashlib.sha256(route_path.read_bytes()).hexdigest()
          if actual_route_sha != expected_route_sha:
              raise SystemExit("RESUME_ROUTE_MANIFEST_SHA256_MISMATCH")
          print("RESUME_ROUTE_MANIFEST_VERIFIED=" + actual_route_sha)
          PY
      - name: Download this run's build bundle and admission (non-resume)
        if: ${{ inputs.resume_source_run_id == '' || inputs.resume_source_run_id == null || inputs.resume_source_run_id == '0' }}
        uses: actions/download-artifact@v4
        with:
          name: a6-build-${{ github.run_id }}
          path: handoff
      - name: Download this run's admission (non-resume)
        if: ${{ inputs.resume_source_run_id == '' || inputs.resume_source_run_id == null || inputs.resume_source_run_id == '0' }}
        uses: actions/download-artifact@v4
        with:
          name: a6-admission-${{ github.run_id }}
          path: handoff
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Record build ready (skipped when resuming an in-flight transaction)
        if: ${{ inputs.resume_source_run_id == '' || inputs.resume_source_run_id == null || inputs.resume_source_run_id == '0' }}
        run: python code/tools/publisher/workflow_stage_cli.py record-build-ready --build-bundle handoff/runner-evidence/v1-build-bundle.json --admission handoff/admission.json --journal state/publisher-state/production-transaction-journal.json --repository state --branch main
      - name: Reuse the source production baseline (resume path)
        if: ${{ inputs.resume_source_run_id != '' && inputs.resume_source_run_id != null && inputs.resume_source_run_id != '0' }}
        uses: actions/download-artifact@v4
        with:
          name: a6-production-baseline-${{ inputs.resume_source_run_id }}
          path: handoff
          run-id: ${{ inputs.resume_source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: a6-production-baseline-${{ github.run_id }}
          path: ${{ (inputs.resume_source_run_id != '' && inputs.resume_source_run_id != null && inputs.resume_source_run_id != '0') && 'handoff/published-static-state.json' || 'state/publisher-state/published-static-state.json' }}
          if-no-files-found: error
      - name: Re-expose the source build bundle under this run's canonical name (resume path)
        if: ${{ inputs.resume_source_run_id != '' && inputs.resume_source_run_id != null && inputs.resume_source_run_id != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: a6-build-${{ github.run_id }}
          include-hidden-files: true
          path: |
            handoff/runner-evidence/publisher-sealed/
            handoff/runner-evidence/v1-build-bundle.json
            handoff/runner-evidence/current-v2-snapshot.json
            handoff/runner-evidence/prepromotion-local-gates.json
            handoff/runner-build/production-media-manifest.json
            handoff/runner-build/published-route-manifest.json
          if-no-files-found: error
          overwrite: true

  production-baseline-reconciliation:
    needs: build-ready-write
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode == 'PUBLISH' && inputs.ready == 'YES' && needs.build-ready-write.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { actions: read }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: 'a6-production-baseline-${{ github.run_id }}', path: baseline }
      - name: Reconcile active production worker, route, deployment, and persisted static baseline read-only
        env:
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKER: mahoon-art-magazine
          CF_HOSTNAME: ${{ vars.CLOUDFLARE_EXPECTED_HOSTNAME }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          with open('baseline/published-static-state.json', encoding='utf-8') as stream:
              state = json.load(stream)
          if state.get('current_version_type') != 'STATIC' or not state.get('current_version') or not state.get('deployment_id'):
              raise SystemExit('persisted Static production baseline is incomplete')
          account, worker, hostname = (os.environ.get(name, '') for name in ('CF_ACCOUNT', 'CF_WORKER', 'CF_HOSTNAME'))
          if not account or not hostname or not worker:
              raise SystemExit('production baseline configuration variables are missing')
          def get(path):
              request = Request('https://api.cloudflare.com/client/v4' + path,
                                headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']})
              try:
                  with urlopen(request, timeout=30) as response:
                      value = json.load(response)
              except (HTTPError, URLError, TimeoutError, OSError):
                  raise SystemExit('Cloudflare read-only baseline GET failed') from None
              if not isinstance(value, dict) or value.get('success') is not True:
                  raise SystemExit('Cloudflare read-only baseline response was invalid')
              return value.get('result')
          scripts = get(f'/accounts/{account}/workers/scripts')
          if not isinstance(scripts, list) or not any(isinstance(row, dict) and row.get('id') == worker for row in scripts):
              raise SystemExit('active production Worker is not present')
          domains = get(f'/accounts/{account}/workers/domains?{urlencode({"hostname": hostname, "environment": "production"})}')
          if not isinstance(domains, list) or not any(isinstance(row, dict) and row.get('hostname') == hostname and row.get('service') == worker and row.get('environment') == 'production' for row in domains):
              raise SystemExit('production Worker route/domain does not match the accepted Worker')
          deployments = get(f'/accounts/{account}/workers/scripts/{worker}/deployments?per_page=1')
          rows = deployments.get('deployments') if isinstance(deployments, dict) else None
          if not isinstance(rows, list) or not rows or not isinstance(rows[0], dict):
              raise SystemExit('active production deployment is unavailable')
          live = rows[0]
          if live.get('id') != state['deployment_id']:
              raise SystemExit('PRODUCTION_BASELINE_DRIFT: deployment identity differs')
          versions = live.get('versions')
          if not isinstance(versions, list):
              raise SystemExit('active deployment version allocation is unavailable')
          allocation = {item.get('version_id'): item.get('percentage') for item in versions if isinstance(item, dict)}
          if any(not isinstance(k, str) or not isinstance(v, int) or isinstance(v, bool) or not 0 <= v <= 100 for k, v in allocation.items()):
              raise SystemExit('active deployment version allocation is malformed')
          if allocation.get(state['current_version']) != 100 or sum(allocation.values()) != 100:
              raise SystemExit('PRODUCTION_BASELINE_DRIFT: active Static version allocation differs')
          print('PRODUCTION_BASELINE_RECONCILIATION=PASS')
          print('IDENTITY_SEMANTICS=deployment_id is compared to deployment id; current_version is compared to the 100-percent deployed version id')
          PY

  # Mutation operations and their journal writes remain distinct credential boundaries.
  upload-intent-write:
    needs: [build-ready-write, production-baseline-reconciliation]
    # ponytail: on resume the source upload intent is already durably recorded in the
    # live journal (reconciled APPLIED) and is re-exposed by resume-source-carryforward;
    # minting a second intent would corrupt the transaction, so skip the direct chain.
    if: ${{ always() && needs.build-ready-write.result == 'success' && (inputs.mode != 'PUBLISH' || needs.production-baseline-reconciliation.result == 'success') && (inputs.resume_source_run_id == '' || inputs.resume_source_run_id == null || inputs.resume_source_run_id == '0') }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-build-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-admission-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Seal and durably record upload intent
        run: |
          python code/tools/publisher/workflow_stage_cli.py create-mutation-intent --operation upload_version --build-bundle handoff/runner-evidence/v1-build-bundle.json --prerequisite handoff/admission.json --journal state/publisher-state/production-transaction-journal.json --output upload-intent.json
          python code/tools/publisher/workflow_stage_cli.py record-intent --intent upload-intent.json --journal state/publisher-state/production-transaction-journal.json --repository state --branch main --reference handoff/runner-evidence/v1-build-bundle.json --reference handoff/admission.json
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-upload-intent-${{ github.run_id }}', path: upload-intent.json, if-no-files-found: error }

  cloudflare-upload-operation:
    needs: upload-intent-write
    if: ${{ !cancelled() && needs.upload-intent-write.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-build-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-admission-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Execute the exact recorded upload operation
        env:
          PYTHONPATH: code/tools/publisher:code/tools:code
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          MAHOON_WRANGLER: npx wrangler@4.83.0
          CLOUDFLARE_ACCOUNT_ID: "773d2dc31655b158d088296a14af5834"
        run: >-
          python code/tools/publisher/workflow_stage_cli.py execute-operation
          --intent handoff/upload-intent.json
          --build-bundle handoff/runner-evidence/v1-build-bundle.json
          --prerequisite handoff/admission.json
          --journal state/publisher-state/production-transaction-journal.json
          --sealed-root "handoff/runner-evidence/publisher-sealed/$(python -c 'import json; print(json.load(open("handoff/runner-evidence/v1-build-bundle.json"))["payload"]["content_fingerprint"])')/site"
          --config code/website/dreary-disk/wrangler.jsonc --backend wrangler --output upload-result.json
          --reference handoff/runner-evidence/v1-build-bundle.json --reference handoff/admission.json
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-upload-result-${{ github.run_id }}', path: upload-result.json, if-no-files-found: error }

  upload-result-write:
    needs: cloudflare-upload-operation
    if: ${{ !cancelled() && needs.cloudflare-upload-operation.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs:
      result_state: ${{ steps.record.outputs.result_state }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-result-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-admission-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: record
        run: |
          python code/tools/publisher/workflow_stage_cli.py record-result --intent handoff/upload-intent.json --result handoff/upload-result.json --journal state/publisher-state/production-transaction-journal.json --repository state --branch main --reference handoff/admission.json | tee record.json
          python -c "import json,os,sys; raw=open('record.json').read().strip(); sys.exit('record-result CLI produced no output; journal write may have completed - inspect before retrying') if not raw else open(os.environ['GITHUB_OUTPUT'],'a').write('result_state='+json.loads(raw)['status']+'\n')"
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-upload-direct-result-${{ github.run_id }}', path: handoff/upload-result.json, if-no-files-found: error }

  resume-source-carryforward:
    # ponytail: needs build-ready-write (the admission/build re-exposure boundary)
    # rather than upload-result-write, because on resume the direct upload-intent-write
    # self-blocks (COALESCED admission vs ADMITTED prerequisite) and the source
    # intent/result must be re-exposed regardless of the direct chain's outcome.
    needs: [build-ready-write]
    if: ${{ always() && inputs.resume_source_run_id != '' && inputs.resume_source_run_id != null && inputs.resume_source_run_id != '0' && needs.build-ready-write.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    outputs:
      carried: ${{ steps.bridge.outputs.carried }}
      source_result_state: ${{ steps.bridge.outputs.source_result_state }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.sha }}', path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - name: Download the source run's sealed upload intent and result
        uses: actions/download-artifact@v4
        with:
          name: a6-upload-intent-${{ inputs.resume_source_run_id }}
          path: handoff
          run-id: ${{ inputs.resume_source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the source run's sealed upload result
        uses: actions/download-artifact@v4
        with:
          name: a6-upload-direct-result-${{ inputs.resume_source_run_id }}
          path: handoff
          run-id: ${{ inputs.resume_source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: bridge
        env:
          PYTHONPATH: code/tools/publisher:code/tools:code
          RESUME_SOURCE_RUN_ID: ${{ inputs.resume_source_run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          source_run = os.environ["RESUME_SOURCE_RUN_ID"]
          active = json.loads(Path("state/publisher-state/production-transaction-journal.json").read_text(encoding="utf-8"))["active"]
          assert active is not None, "no active transaction to resume"
          upload_op = active["operations"]["upload_version"]
          assert upload_op["result_state"] == "APPLIED", f"resume-carryforward requires upload already APPLIED on the active transaction, got {upload_op['result_state']}"
          original = json.loads(Path("handoff/upload-result.json").read_text(encoding="utf-8"))
          state = original["payload"]["result_state"]
          # ponytail: APPLIED source result is already reconciled in the journal;
          # re-expose it for direct downstream use. UNKNOWN source result needs
          # the in-run recovery re-derivation chain.
          assert state in {"UNKNOWN", "APPLIED"}, f"resume-carryforward requires the source result to be UNKNOWN or APPLIED, got {state}"
          print(f"RESUME_CARRY_FORWARD=run{source_run}; journal already APPLIED; source result state={state}; re-exposing source intent/result")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("carried=true\n")
              output.write(f"source_result_state={state}\n")
          PY
      - name: Re-expose the source upload intent under this run's handoff name
        uses: actions/upload-artifact@v4
        with:
          name: a6-upload-intent-${{ github.run_id }}
          path: handoff/upload-intent.json
          if-no-files-found: error
          overwrite: true
      - name: Re-expose the source upload result under this run's handoff name
        uses: actions/upload-artifact@v4
        with:
          name: a6-upload-direct-result-${{ github.run_id }}
          path: handoff/upload-result.json
          if-no-files-found: error
          overwrite: true

  # Re-expose the source run's sealed zero-percent intent/result under this run's
  # canonical artifact names when the journal already records deploy_zero_percent
  # APPLIED. This carries forward the completed zero-percent operation without
  # re-recording (which would raise DuplicateMutation) or re-executing it.
  # The pre-promotion-proof and promote chain then complete using the carried
  # sealed evidence, preserving the original APPLIED identity.
  resume-zero-carryforward:
    needs: [resume-source-carryforward]
    # ponytail: skip when the source zero-percent is not already APPLIED,
    # or when we are not on the resume path with an APPLIED source upload.
    if: ${{ always() && inputs.resume_source_run_id != '' && inputs.resume_source_run_id != null && inputs.resume_source_run_id != '0' && needs.resume-source-carryforward.result == 'success' && needs.resume-source-carryforward.outputs.source_result_state == 'APPLIED' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    outputs:
      carried: ${{ steps.bridge.outputs.carried }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.sha }}', path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - name: Download the source run's sealed zero-percent intent
        uses: actions/download-artifact@v4
        with:
          name: a6-zero-intent-${{ inputs.resume_source_run_id }}
          path: handoff
          run-id: ${{ inputs.resume_source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the source run's sealed zero-percent direct result
        uses: actions/download-artifact@v4
        with:
          name: a6-zero-direct-result-${{ inputs.resume_source_run_id }}
          path: handoff
          run-id: ${{ inputs.resume_source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: bridge
        env:
          PYTHONPATH: code/tools/publisher:code/tools:code
          RESUME_SOURCE_RUN_ID: ${{ inputs.resume_source_run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          source_run = os.environ["RESUME_SOURCE_RUN_ID"]
          journal = json.loads(Path("state/publisher-state/production-transaction-journal.json").read_text(encoding="utf-8"))
          active = journal["active"]
          assert active is not None, "no active transaction to resume"

          zero_op = active["operations"]["deploy_zero_percent"]
          assert zero_op["result_state"] == "APPLIED", \
              f"zero-carryforward requires journal zero-percent APPLIED, got {zero_op['result_state']}"

          zero_intent = json.loads(Path("handoff/zero-percent-intent.json").read_text(encoding="utf-8"))
          zero_result = json.loads(Path("handoff/zero-percent-result.json").read_text(encoding="utf-8"))

          for art in (zero_intent, zero_result):
              tx = art["transaction"]
              assert tx["logical_transaction_id"] == active["logical_transaction_id"], \
                  "zero carryforward: transaction ID mismatch"
              assert tx["content_revision"] == active["content_revision"], \
                  "zero carryforward: content revision mismatch"
              assert tx["worker"] == active["worker"], "zero carryforward: worker mismatch"

          assert zero_result["payload"]["intent_artifact_sha256"] == zero_intent["artifact_sha256"], \
              "zero carryforward: result does not seal to the source intent"
          assert zero_intent["payload"]["build_bundle_sha256"] == zero_result["payload"]["build_bundle_sha256"], \
              "zero carryforward: build bundle SHA mismatch between intent and result"
          assert zero_result["payload"]["result_state"] == "APPLIED", \
              f"zero carryforward: source result state is {zero_result['payload']['result_state']}, expected APPLIED"
          assert zero_result["producer"]["workflow_run_id"] == source_run, \
              f"zero carryforward: result produced by run {zero_result['producer']['workflow_run_id']}, expected {source_run}"

          print(f"RESUME_ZERO_CARRY_FORWARD=run{source_run}; journal zero-percent APPLIED; re-exposing source zero intent/result")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("carried=true\n")
          PY
      - name: Re-expose the source zero-percent intent under this run's canonical name
        uses: actions/upload-artifact@v4
        with:
          name: a6-zero-intent-${{ github.run_id }}
          path: handoff/zero-percent-intent.json
          if-no-files-found: error
          overwrite: true
      - name: Re-expose the source zero-percent direct result under this run's canonical name
        uses: actions/upload-artifact@v4
        with:
          name: a6-zero-direct-result-${{ github.run_id }}
          path: handoff/zero-percent-result.json
          if-no-files-found: error
          overwrite: true

  resume-upload-bridge:
    needs: [upload-create-recovered-result]
    # ponytail: only meaningful when an UNKNOWN upload was recovered in-run;
    # on the APPLIED carryforward path these artifacts do not exist.
    if: ${{ always() && inputs.resume_source_run_id != '' && inputs.resume_source_run_id != null && inputs.resume_source_run_id != '0' && needs.upload-create-recovered-result.outputs.recovered == 'true' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    outputs:
      uploaded: ${{ steps.bridge.outputs.uploaded }}
      recovered: ${{ needs.upload-create-recovered-result.outputs.recovered == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.sha }}', path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - name: Download this run's in-run derived recovery decision and readback
        uses: actions/download-artifact@v4
        with:
          name: a6-upload-decision-${{ github.run_id }}
          path: handoff
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download this run's in-run derived recovery readback evidence
        uses: actions/download-artifact@v4
        with:
          name: a6-upload-readback-${{ github.run_id }}
          path: handoff
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download this run's recovered upload result
        uses: actions/download-artifact@v4
        with:
          name: a6-upload-recovered-result-${{ github.run_id }}
          path: handoff
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: bridge
        env:
          PYTHONPATH: code/tools/publisher:code/tools:code
          RESUME_SOURCE_RUN_ID: ${{ inputs.resume_source_run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          source_run = os.environ["RESUME_SOURCE_RUN_ID"]
          active = json.loads(Path("state/publisher-state/production-transaction-journal.json").read_text(encoding="utf-8"))["active"]
          assert active is not None, "no active transaction to resume"
          upload_op = active["operations"]["upload_version"]
          assert upload_op["result_state"] == "APPLIED", f"resume-bridge requires upload already APPLIED on the active transaction, got {upload_op['result_state']}"
          recovered = json.loads(Path("handoff/recovered-upload-result.json").read_text(encoding="utf-8"))
          assert recovered["payload"]["result_state"] == "APPLIED", "resume-bridge requires a recovered APPLIED upload result"
          print(f"RESUME_UPLOAD_BRIDGE=recovered-applied-upload; no new CF upload executed; run{source_run}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("uploaded=true\n")
          PY

  upload-recovery-readback-observe:
    needs: [upload-result-write, resume-source-carryforward]
    # ponytail: an APPLIED source result is already reconciled in the journal and is
    # re-exposed directly by carryforward; the UNKNOWN-only recovery chain must not run.
    if: ${{ always() && ((needs.upload-result-write.outputs.result_state == 'UNKNOWN') || (inputs.resume_source_run_id != '' && inputs.resume_source_run_id != null && inputs.resume_source_run_id != '0' && needs.resume-source-carryforward.result == 'success' && needs.resume-source-carryforward.outputs.source_result_state == 'UNKNOWN')) }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-direct-result-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-recovered-result-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-readback-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-decision-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-admission-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python code/tools/publisher/workflow_stage_cli.py proof-recovery recovery-readback-observe --intent handoff/upload-intent.json --result handoff/upload-result.json --reference handoff/admission.json --output upload-readback.json
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-upload-readback-${{ github.run_id }}', path: upload-readback.json, if-no-files-found: error }

  upload-recovery-decision:
    # ponytail: an always-gated readback-observe can still sit on a skipped
    # sibling (resume-source-carryforward), and a default success() would
    # propagate that skip. The observe's own if already encodes when the
    # decision is meaningful, so require it to have actually run.
    if: ${{ always() && needs.upload-recovery-readback-observe.result == 'success' }}
    needs: upload-recovery-readback-observe
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      decision: ${{ steps.decision.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-direct-result-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-readback-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-admission-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: decision
        run: |
          python code/tools/publisher/workflow_stage_cli.py proof-recovery recovery-decision --intent handoff/upload-intent.json --result handoff/upload-result.json --readback handoff/upload-readback.json --journal state/publisher-state/production-transaction-journal.json --reference handoff/admission.json --output upload-recovery-decision.json | tee decision-status.json
          python -c "import json,os; open(os.environ['GITHUB_OUTPUT'],'a').write('decision='+json.load(open('decision-status.json'))['status']+'\n')"
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-upload-decision-${{ github.run_id }}', path: upload-recovery-decision.json, if-no-files-found: error }

  upload-reconcile-recovery-decision:
    if: ${{ always() && needs.upload-recovery-decision.result == 'success' }}
    needs: upload-recovery-decision
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs:
      reconciliation: ${{ steps.reconcile.outputs.reconciliation }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-decision-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: reconcile
        run: |
          python code/tools/publisher/workflow_stage_cli.py reconcile-recovery-decision --decision handoff/upload-recovery-decision.json --repository state --branch main | tee reconcile-status.json
          python -c "import json,os; open(os.environ['GITHUB_OUTPUT'],'a').write('reconciliation='+json.load(open('reconcile-status.json'))['status']+'\n')"

  upload-create-recovered-result:
    needs: [upload-recovery-decision, upload-reconcile-recovery-decision]
    if: ${{ always() && needs.upload-recovery-decision.outputs.decision == 'RECONCILED_APPLIED' && needs.upload-reconcile-recovery-decision.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      recovered: ${{ steps.bridge.outputs.recovered }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-direct-result-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-readback-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-decision-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-admission-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: bridge
        run: |
          python code/tools/publisher/workflow_stage_cli.py create-recovered-result --intent handoff/upload-intent.json --result handoff/upload-result.json --readback handoff/upload-readback.json --decision handoff/upload-recovery-decision.json --repository state --branch main --reference handoff/admission.json --no-require-fresh --output recovered-upload-result.json
          echo "recovered=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-upload-recovered-result-${{ github.run_id }}', path: recovered-upload-result.json, if-no-files-found: error }

  zero-percent-intent-write:
    needs: [upload-result-write, upload-create-recovered-result, resume-source-carryforward, resume-zero-carryforward]
    # ponytail: the upload APPLIED proof arrives from the direct chain, the recovered
    # bridge (UNKNOWN source result), or the direct carryforward (APPLIED source result).
    # When the source zero-percent is already APPLIED and re-exposed by
    # resume-zero-carryforward, the direct intent-write is skipped to avoid
    # DuplicateMutation; the carried sealed evidence is used downstream instead.
    if: ${{ always() && ((needs.upload-result-write.result == 'success' && needs.upload-result-write.outputs.result_state == 'APPLIED') || needs.upload-create-recovered-result.outputs.recovered == 'true' || (inputs.resume_source_run_id != '' && inputs.resume_source_run_id != null && inputs.resume_source_run_id != '0' && needs.resume-source-carryforward.result == 'success' && needs.resume-source-carryforward.outputs.source_result_state == 'APPLIED')) && !(needs.resume-zero-carryforward.result == 'success' && needs.resume-zero-carryforward.outputs.carried == 'true') }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-build-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-admission-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-direct-result-${{ github.run_id }}', path: handoff }
        if: always()
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-recovered-result-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Seal and durably record zero-percent intent
        run: |
          upload_result=handoff/upload-result.json
          if [ '${{ needs.upload-create-recovered-result.outputs.recovered }}' = 'true' ]; then upload_result=handoff/recovered-upload-result.json; fi
          python code/tools/publisher/workflow_stage_cli.py create-mutation-intent --operation deploy_zero_percent --build-bundle handoff/runner-evidence/v1-build-bundle.json --prerequisite "$upload_result" --prerequisite-intent handoff/upload-intent.json --journal state/publisher-state/production-transaction-journal.json --reference handoff/admission.json --output zero-percent-intent.json
          python code/tools/publisher/workflow_stage_cli.py record-intent --intent zero-percent-intent.json --journal state/publisher-state/production-transaction-journal.json --repository state --branch main --reference handoff/admission.json --reference handoff/upload-intent.json --reference "$upload_result"
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-zero-intent-${{ github.run_id }}', path: zero-percent-intent.json, if-no-files-found: error }

  cloudflare-zero-percent-operation:
    needs: [zero-percent-intent-write, upload-create-recovered-result]
    if: ${{ !cancelled() && needs.zero-percent-intent-write.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-build-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-direct-result-${{ github.run_id }}', path: handoff }
        if: always()
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-recovered-result-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-readback-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-decision-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Execute the exact recorded zero-percent operation
        env:
          PYTHONPATH: code/tools/publisher:code/tools:code
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          MAHOON_WRANGLER: npx wrangler@4.83.0
          CLOUDFLARE_ACCOUNT_ID: "773d2dc31655b158d088296a14af5834"
        run: |
          upload_result=handoff/upload-result.json
          refs=(--reference handoff/upload-intent.json)
          if [ '${{ needs.upload-create-recovered-result.outputs.recovered }}' = 'true' ]; then
            upload_result=handoff/recovered-upload-result.json
            refs+=(--reference handoff/upload-result.json --reference handoff/upload-readback.json --reference handoff/upload-recovery-decision.json)
          fi
          python code/tools/publisher/workflow_stage_cli.py execute-operation \
            --intent handoff/zero-percent-intent.json --build-bundle handoff/runner-evidence/v1-build-bundle.json \
            --prerequisite "$upload_result" --prerequisite-intent handoff/upload-intent.json \
            --journal state/publisher-state/production-transaction-journal.json \
            --sealed-root "handoff/runner-evidence/publisher-sealed/$(python -c 'import json; print(json.load(open("handoff/runner-evidence/v1-build-bundle.json"))["payload"]["content_fingerprint"])')/site" \
            --config code/website/dreary-disk/wrangler.jsonc --backend wrangler --output zero-percent-result.json \
            "${refs[@]}"
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-zero-result-${{ github.run_id }}', path: zero-percent-result.json, if-no-files-found: error }

  zero-percent-result-write:
    needs: cloudflare-zero-percent-operation
    if: ${{ !cancelled() && needs.cloudflare-zero-percent-operation.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs:
      result_state: ${{ steps.record.outputs.result_state }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-direct-result-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-result-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: record
        run: |
          python code/tools/publisher/workflow_stage_cli.py record-result --intent handoff/zero-percent-intent.json --result handoff/zero-percent-result.json --journal state/publisher-state/production-transaction-journal.json --repository state --branch main --reference handoff/upload-intent.json --reference handoff/upload-result.json | tee record.json
          python -c "import json,os; open(os.environ['GITHUB_OUTPUT'],'a').write('result_state='+json.load(open('record.json'))['status']+'\n')"
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-zero-direct-result-${{ github.run_id }}', path: handoff/zero-percent-result.json, if-no-files-found: error }

  zero-recovery-readback-observe:
    needs: zero-percent-result-write
    if: ${{ always() && needs.zero-percent-result-write.outputs.result_state == 'UNKNOWN' }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-direct-result-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-recovered-result-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-readback-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-decision-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-direct-result-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python code/tools/publisher/workflow_stage_cli.py proof-recovery recovery-readback-observe --intent handoff/zero-percent-intent.json --result handoff/zero-percent-result.json --reference handoff/upload-intent.json --reference handoff/upload-result.json --output zero-recovery-readback.json
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-zero-readback-${{ github.run_id }}', path: zero-recovery-readback.json, if-no-files-found: error }

  zero-recovery-decision:
    if: ${{ always() && needs.zero-recovery-readback-observe.result == 'success' }}
    needs: zero-recovery-readback-observe
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      decision: ${{ steps.decision.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-direct-result-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-readback-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-direct-result-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: decision
        run: |
          python code/tools/publisher/workflow_stage_cli.py proof-recovery recovery-decision --intent handoff/zero-percent-intent.json --result handoff/zero-percent-result.json --readback handoff/zero-recovery-readback.json --journal state/publisher-state/production-transaction-journal.json --reference handoff/upload-intent.json --reference handoff/upload-result.json --output zero-recovery-decision.json | tee decision-status.json
          python -c "import json,os; open(os.environ['GITHUB_OUTPUT'],'a').write('decision='+json.load(open('decision-status.json'))['status']+'\n')"
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-zero-decision-${{ github.run_id }}', path: zero-recovery-decision.json, if-no-files-found: error }

  zero-reconcile-recovery-decision:
    if: ${{ always() && needs.zero-recovery-decision.result == 'success' }}
    needs: zero-recovery-decision
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-decision-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python code/tools/publisher/workflow_stage_cli.py reconcile-recovery-decision --decision handoff/zero-recovery-decision.json --repository state --branch main

  zero-create-recovered-result:
    needs: [zero-recovery-decision, zero-reconcile-recovery-decision]
    if: ${{ always() && needs.zero-recovery-decision.outputs.decision == 'RECONCILED_APPLIED' && needs.zero-reconcile-recovery-decision.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      recovered: ${{ steps.bridge.outputs.recovered }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-direct-result-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-readback-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-decision-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-upload-direct-result-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: bridge
        run: |
          python code/tools/publisher/workflow_stage_cli.py create-recovered-result --intent handoff/zero-percent-intent.json --result handoff/zero-percent-result.json --readback handoff/zero-recovery-readback.json --decision handoff/zero-recovery-decision.json --repository state --branch main --reference handoff/upload-intent.json --reference handoff/upload-result.json --output recovered-zero-result.json
          echo "recovered=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-zero-recovered-result-${{ github.run_id }}', path: recovered-zero-result.json, if-no-files-found: error }

  pre-promotion-proof:
    needs: [zero-percent-result-write, zero-create-recovered-result, resume-zero-carryforward]
    # ponytail: the zero-percent proof arrives from the direct result-write, the
    # recovered bridge, or the direct carryforward (when the source zero-percent
    # is already APPLIED and re-exposed under this run's canonical names).
    if: ${{ always() && (inputs.preproof_source_run_id == '' || inputs.preproof_source_run_id == null || inputs.preproof_source_run_id == '0') && (needs.zero-percent-result-write.outputs.result_state == 'APPLIED' || needs.zero-create-recovered-result.outputs.recovered == 'true' || (needs.resume-zero-carryforward.result == 'success' && needs.resume-zero-carryforward.outputs.carried == 'true')) }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      # Keep the published build source-pinned; use current read-only proof tooling for bounded diagnostics.
      - uses: actions/checkout@v4
        with: { ref: '${{ github.sha }}', path: diagnostics, persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-build-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-direct-result-${{ github.run_id }}', path: handoff }
        if: always()
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-recovered-result-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-readback-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-decision-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix diagnostics/website/dreary-disk
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('diagnostics/website/dreary-disk/package-lock.json') }}
      - name: Install lockfile-pinned Playwright Chromium
        working-directory: diagnostics/website/dreary-disk
        run: npx playwright install --with-deps chromium
      - name: Observe and seal combined pre-promotion proof
        env:
          PYTHONPATH: diagnostics/tools:code/tools/publisher:code/tools:code
          MAHOON_WRANGLER: npx wrangler@4.83.0
          CLOUDFLARE_ACCOUNT_ID: "773d2dc31655b158d088296a14af5834"
        run: |
          workspace="$GITHUB_WORKSPACE"
          zero_result="$workspace/handoff/zero-percent-result.json"
          refs=(--reference "$workspace/handoff/zero-percent-intent.json")
          if [ '${{ needs.zero-create-recovered-result.outputs.recovered }}' = 'true' ]; then
            zero_result="$workspace/handoff/recovered-zero-result.json"
            refs+=(--reference "$workspace/handoff/zero-percent-result.json" --reference "$workspace/handoff/zero-recovery-readback.json" --reference "$workspace/handoff/zero-recovery-decision.json")
          fi
          fingerprint="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["payload"]["content_fingerprint"])' "$workspace/handoff/runner-evidence/v1-build-bundle.json")"
          args=(
            --build-bundle "$workspace/handoff/runner-evidence/v1-build-bundle.json"
            --deploy-intent "$workspace/handoff/zero-percent-intent.json"
            --deploy-result "$zero_result"
            --sealed-root "$workspace/handoff/runner-evidence/publisher-sealed/${fingerprint}/site"
            --snapshot "$workspace/handoff/runner-evidence/current-v2-snapshot.json"
            --route-manifest "$workspace/handoff/runner-build/published-route-manifest.json"
            --media-manifest "$workspace/handoff/runner-build/production-media-manifest.json"
            --base-url https://mahoonartmagazine.ir
            --evidence-dir "$workspace/runner-evidence/pre-promotion-proof"
            --output "$workspace/pre-promotion-proof.json"
          )
          python diagnostics/tools/publisher/workflow_stage_cli.py pre-promotion-proof-observe \
            "${args[@]}" "${refs[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a6-preproof-${{ github.run_id }}
          path: |
            pre-promotion-proof.json
            runner-evidence/pre-promotion-proof/**
            runner-evidence/pre-promotion-proof-browser-diagnostic.json
          if-no-files-found: ignore

  resume-preproof-carryforward:
    needs: [build-ready-write, resume-zero-carryforward]
    if: ${{ always() && (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.preproof_source_run_id != '' && inputs.preproof_source_run_id != null && inputs.preproof_source_run_id != '0' && needs.build-ready-write.result == 'success' && needs.resume-zero-carryforward.result == 'success' && needs.resume-zero-carryforward.outputs.carried == 'true' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    outputs:
      carried: ${{ steps.verify.outputs.carried }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.resume_source_sha }}", path: code }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-build-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-direct-result-${{ github.run_id }}', path: handoff }
        if: always()
      - name: Download the prior passing pre-promotion proof
        uses: actions/download-artifact@v4
        with:
          name: a6-preproof-${{ inputs.preproof_source_run_id }}
          path: handoff
          run-id: ${{ inputs.preproof_source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: verify
        env:
          PYTHONPATH: code/tools/publisher:code/tools:code
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from publisher import artifact_transport as transport

          root = Path("handoff")
          build = transport.read_artifact(root / "runner-evidence/v1-build-bundle.json", expected_type="build_bundle")
          refs = transport.references(build)
          zero_intent = transport.read_artifact(root / "zero-percent-intent.json", expected_type="mutation_intent",
                                                expected_transaction=build["transaction"],
                                                expected_source_sha=build["producer"]["source_sha"],
                                                referenced_artifacts=refs)
          zero_result = transport.read_artifact(root / "zero-percent-result.json", expected_type="mutation_result",
                                                expected_transaction=build["transaction"],
                                                expected_source_sha=build["producer"]["source_sha"],
                                                referenced_artifacts=transport.references(build, zero_intent))
          refs = transport.references(build, zero_intent, zero_result)
          proof = transport.read_artifact(root / "pre-promotion-proof.json",
                                          expected_type="pre_promotion_proof_evidence",
                                          expected_transaction=build["transaction"],
                                          expected_source_sha=build["producer"]["source_sha"],
                                          referenced_artifacts=refs)
          identity = proof["payload"]["candidate_identity"]
          desired = zero_intent["payload"]["desired_state"]
          readback = zero_result["payload"]["readback_reference"]
          assert proof["payload"]["PASS"] is True, "carried pre-promotion proof did not pass"
          assert proof["payload"]["build_bundle_artifact_sha256"] == build["artifact_sha256"]
          assert proof["payload"]["deploy_zero_percent_result_artifact_sha256"] == zero_result["artifact_sha256"]
          assert zero_result["payload"]["result_state"] == "APPLIED"
          assert identity["candidate_version_id"] == desired["candidate_version_id"]
          assert identity["baseline_version_id"] == desired["baseline_version_id"]
          assert identity["zero_percent_deployment_id"] == readback["resource_id"]
          Path("pre-promotion-proof.json").write_bytes((root / "pre-promotion-proof.json").read_bytes())
          print("CARRIED_PASSING_PREPROOF=YES; BUILD_AND_ZERO_RESULT_LINEAGE=PASS; VERSION_IDENTITY=PASS")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("carried=true\n")
          PY
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-preproof-${{ github.run_id }}', path: pre-promotion-proof.json, if-no-files-found: error }

  promote-intent-write:
    needs: [pre-promotion-proof, resume-preproof-carryforward, zero-percent-result-write, zero-create-recovered-result, resume-zero-carryforward]
    # ponytail: requires a passing pre-promotion proof and a zero-percent proof from
    # the direct result, the recovered bridge, or the carryforward path.
    if: ${{ always() && inputs.mode != 'POST_PROMOTION_FINALIZE' && (needs.pre-promotion-proof.result == 'success' || needs.resume-preproof-carryforward.outputs.carried == 'true') && (needs.zero-percent-result-write.outputs.result_state == 'APPLIED' || needs.zero-create-recovered-result.outputs.recovered == 'true' || (needs.resume-zero-carryforward.result == 'success' && needs.resume-zero-carryforward.outputs.carried == 'true')) }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs:
      zero_recovered: ${{ steps.intent.outputs.zero_recovered }}
    steps:
      # The intent stays bound to the source build SHA; use the current CLI to preserve its verified references.
      - uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-build-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-preproof-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-direct-result-${{ github.run_id }}', path: handoff }
        if: always()
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-recovered-result-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-readback-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-decision-${{ github.run_id }}', path: handoff }
        continue-on-error: true
        if: always()
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Seal and durably record promote intent
        id: intent
        run: |
          zero_result=handoff/zero-percent-result.json
          refs=(--reference handoff/pre-promotion-proof.json --reference handoff/zero-percent-intent.json --reference handoff/runner-evidence/v1-build-bundle.json)
          if [ '${{ needs.zero-create-recovered-result.outputs.recovered }}' = 'true' ]; then
            zero_result=handoff/recovered-zero-result.json
            refs+=(--reference handoff/zero-percent-result.json --reference handoff/zero-recovery-readback.json --reference handoff/zero-recovery-decision.json)
          fi
          python code/tools/publisher/workflow_stage_cli.py create-mutation-intent --operation promote --build-bundle handoff/runner-evidence/v1-build-bundle.json --prerequisite handoff/pre-promotion-proof.json --prerequisite-intent handoff/zero-percent-intent.json --journal state/publisher-state/production-transaction-journal.json "${refs[@]}" --reference "$zero_result" --output promote-intent.json
          python code/tools/publisher/workflow_stage_cli.py record-intent --intent promote-intent.json --journal state/publisher-state/production-transaction-journal.json --repository state --branch main "${refs[@]}" --reference "$zero_result"
          echo "zero_recovered=${{ needs.zero-create-recovered-result.outputs.recovered }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-promote-intent-${{ github.run_id }}', path: promote-intent.json, if-no-files-found: error }

  cloudflare-promote-operation:
    needs: promote-intent-write
    if: ${{ !cancelled() && needs.promote-intent-write.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-build-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-preproof-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-direct-result-${{ github.run_id }}', path: handoff }
        if: always()
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-recovered-result-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-readback-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-decision-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Execute exact authorized promotion
        env:
          PYTHONPATH: code/tools/publisher:code/tools:code
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          MAHOON_WRANGLER: npx wrangler@4.83.0
          CLOUDFLARE_ACCOUNT_ID: "773d2dc31655b158d088296a14af5834"
        run: |
          refs=(--reference handoff/runner-evidence/v1-build-bundle.json --reference handoff/pre-promotion-proof.json --reference handoff/zero-percent-intent.json)
          if [ '${{ needs.promote-intent-write.outputs.zero_recovered }}' = 'true' ]; then
            refs+=(--reference handoff/zero-percent-result.json --reference handoff/recovered-zero-result.json --reference handoff/zero-recovery-readback.json --reference handoff/zero-recovery-decision.json)
          else
            refs+=(--reference handoff/zero-percent-result.json)
          fi
          python code/tools/publisher/workflow_stage_cli.py execute-operation \
            --intent handoff/promote-intent.json --build-bundle handoff/runner-evidence/v1-build-bundle.json \
            --prerequisite handoff/pre-promotion-proof.json --journal state/publisher-state/production-transaction-journal.json \
            --sealed-root "handoff/runner-evidence/publisher-sealed/$(python -c 'import json; print(json.load(open("handoff/runner-evidence/v1-build-bundle.json"))["payload"]["content_fingerprint"])')/site" \
            --config code/website/dreary-disk/wrangler.jsonc --backend wrangler --output promote-result.json \
            "${refs[@]}"
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-promote-result-${{ github.run_id }}', path: promote-result.json, if-no-files-found: error }

  promote-result-write:
    needs: cloudflare-promote-operation
    if: ${{ !cancelled() && needs.cloudflare-promote-operation.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs:
      result_state: ${{ steps.record.outputs.result_state }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/checkout@v4
        with: { ref: '${{ github.sha }}', path: code }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-build-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-direct-result-${{ github.run_id }}', path: handoff }
        if: always()
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-recovered-result-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-readback-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-decision-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-result-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-preproof-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: record
        run: |
          zero_result=handoff/zero-percent-result.json
          refs=(--reference handoff/runner-evidence/v1-build-bundle.json --reference handoff/pre-promotion-proof.json --reference handoff/zero-percent-intent.json)
          if [ '${{ needs.zero-create-recovered-result.outputs.recovered }}' = 'true' ]; then
            zero_result=handoff/recovered-zero-result.json
            refs+=(--reference handoff/zero-percent-result.json --reference handoff/zero-recovery-readback.json --reference handoff/zero-recovery-decision.json)
          fi
          python code/tools/publisher/workflow_stage_cli.py record-result \
            --intent handoff/promote-intent.json --result handoff/promote-result.json \
            --journal state/publisher-state/production-transaction-journal.json --repository state --branch main \
            "${refs[@]}" --reference "$zero_result" > record.json
          python -c "import json,os; d=json.load(open('record.json')); assert d['status'] in ('APPLIED','NOT_APPLIED','UNKNOWN'); open(os.environ['GITHUB_OUTPUT'],'a').write('result_state='+d['status']+'\\n')"
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-promote-direct-result-${{ github.run_id }}', path: handoff/promote-result.json, if-no-files-found: error }

  resume-promote-carryforward:
    needs: [build-ready-write, resume-zero-carryforward, resume-preproof-carryforward]
    if: >-
      ${{ always() && inputs.mode == 'POST_PROMOTION_FINALIZE' &&
          inputs.resume_source_run_id != '' && inputs.resume_source_run_id != null && inputs.resume_source_run_id != '0' &&
          needs.build-ready-write.result == 'success' &&
          needs.resume-zero-carryforward.result == 'success' && needs.resume-zero-carryforward.outputs.carried == 'true' &&
          needs.resume-preproof-carryforward.result == 'success' && needs.resume-preproof-carryforward.outputs.carried == 'true' }}
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: read }
    outputs:
      carried: ${{ steps.carry.outputs.carried }}
      result_state: ${{ steps.carry.outputs.result_state }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.sha }}', path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-build-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-preproof-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-direct-result-${{ github.run_id }}', path: handoff }
      - name: Download the already-applied promotion artifacts
        uses: actions/download-artifact@v4
        with:
          name: a6-promote-intent-${{ inputs.resume_source_run_id }}
          path: handoff
          run-id: ${{ inputs.resume_source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the already-applied promotion result
        uses: actions/download-artifact@v4
        with:
          name: a6-promote-result-${{ inputs.resume_source_run_id }}
          path: handoff
          run-id: ${{ inputs.resume_source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: carry
        env:
          PYTHONPATH: code/tools/publisher:code/tools:code
          EXPECTED_SOURCE_SHA: ${{ inputs.resume_source_sha }}
          EXPECTED_SOURCE_RUN_ID: ${{ inputs.resume_source_run_id }}
          EXPECTED_TRANSACTION_ID: ${{ inputs.transaction_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from publisher import artifact_transport as transport
          from publisher.effective_mutation_result import validate_effective_applied_result

          root = Path("handoff")
          journal = json.loads(Path("state/publisher-state/production-transaction-journal.json").read_text(encoding="utf-8"))
          active = journal["active"]
          assert active is not None and active["logical_transaction_id"] == os.environ["EXPECTED_TRANSACTION_ID"]
          assert active["state"] == "intent_recorded" and active["recovery_status"] == "NONE"
          bundle = transport.read_artifact(root / "runner-evidence/v1-build-bundle.json", expected_type="build_bundle",
                                           expected_source_sha=os.environ["EXPECTED_SOURCE_SHA"])
          tx = bundle["transaction"]
          assert tx["logical_transaction_id"] == active["logical_transaction_id"]
          assert bundle["artifact_sha256"] == active["build_bundle_sha256"]
          zero_intent = transport.read_artifact(root / "zero-percent-intent.json", expected_type="mutation_intent",
                                                expected_transaction=tx, expected_source_sha=os.environ["EXPECTED_SOURCE_SHA"],
                                                referenced_artifacts=transport.references(bundle))
          zero_result = transport.read_artifact(root / "zero-percent-result.json", expected_type="mutation_result",
                                                expected_transaction=tx, expected_source_sha=os.environ["EXPECTED_SOURCE_SHA"],
                                                referenced_artifacts=transport.references(bundle, zero_intent))
          proof = transport.read_artifact(root / "pre-promotion-proof.json", expected_type="pre_promotion_proof_evidence",
                                          expected_transaction=tx, expected_source_sha=os.environ["EXPECTED_SOURCE_SHA"],
                                          referenced_artifacts=transport.references(bundle, zero_intent, zero_result))
          refs = transport.references(bundle, zero_intent, zero_result, proof)
          intent = transport.read_artifact(root / "promote-intent.json", expected_type="mutation_intent",
                                           expected_transaction=tx, expected_source_sha=os.environ["EXPECTED_SOURCE_SHA"],
                                           referenced_artifacts=refs)
          refs = transport.references(bundle, zero_intent, zero_result, proof, intent)
          result = transport.read_artifact(root / "promote-result.json", expected_type="mutation_result",
                                           expected_transaction=tx, expected_source_sha=os.environ["EXPECTED_SOURCE_SHA"],
                                           referenced_artifacts=refs)
          promotion = active["operations"]["promote"]
          attempt = promotion["attempts"][-1]
          assert len(promotion["attempts"]) == 2 and attempt["attempt_number"] == 2
          assert promotion["intent_state"] == "RECORDED" and promotion["result_state"] == "NOT_REPORTED"
          assert attempt["intent_state"] == "RECORDED" and attempt["result_state"] == "NOT_REPORTED"
          assert attempt["result_digest"] is None
          assert intent["producer"]["workflow_run_id"] == os.environ["EXPECTED_SOURCE_RUN_ID"]
          assert result["producer"]["workflow_run_id"] == os.environ["EXPECTED_SOURCE_RUN_ID"]
          assert intent["payload"]["operation_id"] == promotion["operation_id"]
          assert intent["payload"]["attempt_id"] == attempt["attempt_id"]
          assert intent["artifact_sha256"] == attempt["intent_artifact_sha256"]
          assert result["payload"]["result_state"] == "APPLIED"
          assert result["payload"]["intent_artifact_sha256"] == intent["artifact_sha256"]
          assert proof["payload"]["PASS"] is True
          assert zero_result["payload"]["result_state"] == "APPLIED"
          validate_effective_applied_result(result, intent, referenced_artifacts=refs)
          print("PROMOTION_CARRY_FORWARD=APPLIED; JOURNAL_LATEST_ATTEMPT=MATCH; SOURCE_ARTIFACTS=SEALED")
          PY
          python code/tools/publisher/workflow_stage_cli.py record-result \
            --intent handoff/promote-intent.json --result handoff/promote-result.json \
            --journal state/publisher-state/production-transaction-journal.json --repository state --branch main \
            --reference handoff/runner-evidence/v1-build-bundle.json \
            --reference handoff/pre-promotion-proof.json \
            --reference handoff/zero-percent-intent.json \
            --reference handoff/zero-percent-result.json > record.json
          python -c "import json,os; d=json.load(open('record.json')); assert d['status']=='APPLIED'; open(os.environ['GITHUB_OUTPUT'],'a').write('carried=true\\nresult_state=APPLIED\\n')"
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-promote-intent-${{ github.run_id }}', path: handoff/promote-intent.json, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-promote-direct-result-${{ github.run_id }}', path: handoff/promote-result.json, if-no-files-found: error }

  promote-recovery-readback-observe:
    needs: promote-result-write
    if: ${{ always() && needs.promote-result-write.outputs.result_state == 'UNKNOWN' }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-direct-result-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-recovered-result-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-readback-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-decision-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-preproof-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python code/tools/publisher/workflow_stage_cli.py proof-recovery recovery-readback-observe --intent handoff/promote-intent.json --result handoff/promote-result.json --reference handoff/pre-promotion-proof.json --output promote-recovery-readback.json
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-promote-readback-${{ github.run_id }}', path: promote-recovery-readback.json, if-no-files-found: error }

  promote-recovery-decision:
    if: ${{ always() && needs.promote-recovery-readback-observe.result == 'success' }}
    needs: promote-recovery-readback-observe
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      decision: ${{ steps.decision.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-direct-result-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-readback-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-preproof-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: decision
        run: |
          python code/tools/publisher/workflow_stage_cli.py proof-recovery recovery-decision --intent handoff/promote-intent.json --result handoff/promote-result.json --readback handoff/promote-recovery-readback.json --journal state/publisher-state/production-transaction-journal.json --reference handoff/pre-promotion-proof.json --output promote-recovery-decision.json | tee decision-status.json
          python -c "import json,os; open(os.environ['GITHUB_OUTPUT'],'a').write('decision='+json.load(open('decision-status.json'))['status']+'\n')"
      - uses: actions/upload-artifact@v4
        with: { name: 'a6-promote-decision-${{ github.run_id }}', path: promote-recovery-decision.json, if-no-files-found: error }

  promote-reconcile-recovery-decision:
    if: ${{ always() && needs.promote-recovery-decision.result == 'success' }}
    needs: promote-recovery-decision
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-decision-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python code/tools/publisher/workflow_stage_cli.py reconcile-recovery-decision --decision handoff/promote-recovery-decision.json --repository state --branch main

  promote-create-recovered-result:
    needs: [promote-recovery-decision, promote-reconcile-recovery-decision]
    if: ${{ always() && needs.promote-recovery-decision.outputs.decision == 'RECONCILED_APPLIED' && needs.promote-reconcile-recovery-decision.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      recovered: ${{ steps.bridge.outputs.recovered }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ (inputs.mode == 'RESUME_ADMITTED' || inputs.mode == 'POST_PROMOTION_FINALIZE') && inputs.resume_source_sha || github.sha }}", path: code }
      - uses: actions/checkout@v4
        with: { ref: main, path: state }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-direct-result-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-readback-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-decision-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-preproof-${{ github.run_id }}', path: handoff }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: bridge
        run: |
