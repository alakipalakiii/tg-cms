      - name: Observe and seal combined production proof
        env:
          PYTHONPATH: diagnostics/tools:code/tools/publisher:code/tools:code
          MAHOON_WRANGLER: npx wrangler@4.83.0
          CLOUDFLARE_ACCOUNT_ID: "773d2dc31655b158d088296a14af5834"
        run: |
          workspace="$GITHUB_WORKSPACE"
          upload_result="$workspace/handoff/upload-result.json"
          zero_result="$workspace/handoff/zero-percent-result.json"
          promote_result="$workspace/handoff/promote-result.json"
          refs=(--reference "$workspace/handoff/upload-intent.json" --reference "$workspace/handoff/zero-percent-intent.json" --reference "$workspace/handoff/promote-intent.json"
                --reference "$workspace/handoff/upload-result.json" --reference "$workspace/handoff/zero-percent-result.json" --reference "$workspace/handoff/promote-result.json")
          if [ '${{ needs.upload-create-recovered-result.outputs.recovered }}' = 'true' ]; then
            upload_result="$workspace/handoff/recovered-upload-result.json"
            refs+=(--reference "$workspace/handoff/upload-result.json" --reference "$workspace/handoff/upload-readback.json" --reference "$workspace/handoff/upload-recovery-decision.json")
          fi
          if [ '${{ needs.zero-create-recovered-result.outputs.recovered }}' = 'true' ]; then
            zero_result="$workspace/handoff/recovered-zero-result.json"
            refs+=(--reference "$workspace/handoff/zero-percent-result.json" --reference "$workspace/handoff/zero-recovery-readback.json" --reference "$workspace/handoff/zero-recovery-decision.json")
          fi
          if [ '${{ needs.promote-create-recovered-result.outputs.recovered }}' = 'true' ]; then
            promote_result="$workspace/handoff/recovered-promote-result.json"
            refs+=(--reference "$workspace/handoff/promote-result.json" --reference "$workspace/handoff/promote-recovery-readback.json" --reference "$workspace/handoff/promote-recovery-decision.json")
          fi
          fingerprint="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["payload"]["content_fingerprint"])' "$workspace/handoff/runner-evidence/v1-build-bundle.json")"
          args=(
            --build-bundle "$workspace/handoff/runner-evidence/v1-build-bundle.json"
            --upload-intent "$workspace/handoff/upload-intent.json"
            --upload-result "$upload_result"
            --deploy-intent "$workspace/handoff/zero-percent-intent.json"
            --deploy-result "$zero_result"
            --pre-promotion-proof "$workspace/handoff/pre-promotion-proof.json"
            --promote-intent "$workspace/handoff/promote-intent.json"
            --promote-result "$promote_result"
            --sealed-root "$workspace/handoff/runner-evidence/publisher-sealed/${fingerprint}/site"
            --snapshot "$workspace/handoff/runner-evidence/current-v2-snapshot.json"
            --route-manifest "$workspace/handoff/runner-build/published-route-manifest.json"
            --media-manifest "$workspace/handoff/runner-build/production-media-manifest.json"
            --local-gates "$workspace/handoff/runner-evidence/prepromotion-local-gates.json"
            --base-url https://mahoonartmagazine.ir
            --evidence-dir "$workspace/runner-evidence/production-proof"
            --output "$workspace/production-proof.json"
          )
          python diagnostics/tools/publisher/workflow_stage_cli.py production-proof-observe \
            "${args[@]}" "${refs[@]}" > proof-status.json
      - id: proof-state
        if: ${{ always() && hashFiles('proof-status.json') != '' }}
        run: python -c "import json,os; d=json.load(open('proof-status.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('proof_state='+d['status']+'\n')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a6-production-proof-${{ github.run_id }}
          path: |
            production-proof.json
            runner-evidence/production-proof/**
            runner-evidence/production-proof-browser-diagnostic.json
          if-no-files-found: ignore

