      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-recovered-result-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-readback-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-zero-decision-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: 'a6-preproof-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-intent-${{ github.run_id }}', path: handoff }
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-direct-result-${{ github.run_id }}', path: handoff }
        if: always()
      - uses: actions/download-artifact@v4
        with: { name: 'a6-promote-recovered-result-${{ github.run_id }}', path: handoff }
        continue-on-error: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix code/website/dreary-disk
      - name: Observe and seal combined production proof
        env:
          PYTHONPATH: code/tools/publisher:code/tools:code
          MAHOON_WRANGLER: npx wrangler@4.83.0
          CLOUDFLARE_ACCOUNT_ID: "773d2dc31655b158d088296a14af5834"
        run: >-
          python code/tools/publisher/workflow_stage_cli.py production-proof-observe
          --build-bundle handoff/runner-evidence/v1-build-bundle.json
          --upload-intent handoff/upload-intent.json --upload-result "${{ needs.upload-create-recovered-result.outputs.recovered == 'true' && 'handoff/recovered-upload-result.json' || 'handoff/upload-result.json' }}"
          --deploy-intent handoff/zero-percent-intent.json --deploy-result "${{ needs.zero-create-recovered-result.outputs.recovered == 'true' && 'handoff/recovered-zero-result.json' || 'handoff/zero-percent-result.json' }}"
          --pre-promotion-proof handoff/pre-promotion-proof.json
          --promote-intent handoff/promote-intent.json --promote-result "${{ needs.promote-create-recovered-result.outputs.recovered == 'true' && 'handoff/recovered-promote-result.json' || 'handoff/promote-result.json' }}"
          --sealed-root "handoff/runner-evidence/publisher-sealed/$(python -c 'import json; print(json.load(open("handoff/runner-evidence/v1-build-bundle.json"))["payload"]["content_fingerprint"])')/site"
          --snapshot handoff/runner-evidence/current-v2-snapshot.json
          --route-manifest handoff/runner-build/published-route-manifest.json
          --media-manifest handoff/runner-build/production-media-manifest.json
          --local-gates handoff/runner-evidence/prepromotion-local-gates.json
          --base-url https://mahoon.art --evidence-dir runner-evidence/production-proof
          --output production-proof.json
          --reference handoff/upload-intent.json --reference handoff/zero-percent-intent.json --reference handoff/promote-intent.json
          --reference handoff/upload-result.json --reference handoff/zero-percent-result.json --reference handoff/promote-result.json
          --reference handoff/upload-readback.json --reference handoff/upload-recovery-decision.json
          --reference handoff/zero-recovery-readback.json --reference handoff/zero-recovery-decision.json
          --reference handoff/promote-recovery-readback.json --reference handoff/promote-recovery-decision.json > proof-status.json
      - id: proof-state
        if: ${{ always() && hashFiles('proof-status.json') != '' }}
        run: python -c "import json,os; d=json.load(open('proof-status.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('proof_state='+d['status']+'\n')"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('production-proof.json') != '' }}
        with: { name: 'a6-production-proof-${{ github.run_id }}', path: production-proof.json, if-no-files-found: error }

