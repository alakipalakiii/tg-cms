  production-proof:
    needs: [upload-result-write, upload-create-recovered-result, zero-percent-result-write,
      zero-create-recovered-result, promote-result-write, promote-create-recovered-result,
      resume-source-carryforward, resume-zero-carryforward, resume-promote-carryforward]
    # ponytail: the APPLIED upload and zero proofs may arrive via their direct,
    # recovered, or in-flight carryforward paths.
    if: >-
      ${{ always() &&
          ((needs.upload-result-write.result == 'success' && needs.upload-result-write.outputs.result_state == 'APPLIED') ||
           needs.upload-create-recovered-result.outputs.recovered == 'true' ||
           (inputs.resume_source_run_id != '' && inputs.resume_source_run_id != null && inputs.resume_source_run_id != '0' &&
            needs.resume-source-carryforward.result == 'success' && needs.resume-source-carryforward.outputs.source_result_state == 'APPLIED')) &&
          (needs.zero-percent-result-write.outputs.result_state == 'APPLIED' || needs.zero-create-recovered-result.outputs.recovered == 'true' ||
           (needs.resume-zero-carryforward.result == 'success' && needs.resume-zero-carryforward.outputs.carried == 'true')) &&
           (needs.promote-result-write.outputs.result_state == 'APPLIED' || needs.promote-create-recovered-result.outputs.recovered == 'true' ||
            (needs.resume-promote-carryforward.result == 'success' && needs.resume-promote-carryforward.outputs.result_state == 'APPLIED')) }}
