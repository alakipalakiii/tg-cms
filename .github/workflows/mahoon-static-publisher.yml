          --deploy-zero-percent-intent handoff/zero-percent-intent.json --deploy-zero-percent-result "${{ needs.zero-create-recovered-result.outputs.recovered == 'true' && 'handoff/recovered-zero-result.json' || 'handoff/zero-percent-result.json' }}"
          --promote-intent handoff/promote-intent.json --promote-result "${{ needs.promote-create-recovered-result.outputs.recovered == 'true' && 'handoff/recovered-promote-result.json' || 'handoff/promote-result.json' }}"
          --reference handoff/upload-intent.json --reference handoff/zero-percent-intent.json --reference handoff/promote-intent.json
          --reference handoff/upload-result.json --reference handoff/zero-percent-result.json --reference handoff/promote-result.json
